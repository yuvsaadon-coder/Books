    /* גופן אחד לכל האפליקציה (לבחירה בהגדרות), וגודל תצוגה (--zoom) */

    .settings-group > h2 { display: flex; align-items: center; gap: 8px; }
    .bg-tealSoft { background: color-mix(in srgb, var(--teal) 14%, transparent); } .bg-brassSoft { background: color-mix(in srgb, var(--brass) 15%, transparent); } .bg-roseSoft { background: color-mix(in srgb, var(--rose) 13%, transparent); }

    .nav-discover { color: var(--accent); }

    :root[data-a11y] a { text-decoration: underline; text-underline-offset: 3px; }
    :root[data-a11y] :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; box-shadow: 0 0 0 6px var(--surface); }
    :root[data-a11y] *, :root[data-a11y] *::before, :root[data-a11y] *::after { animation: none !important; transition: none !important; }

    /* מצב קורא אלקטרוני: שחור-לבן בניגודיות מלאה, בלי אנימציות, צללים, שקיפויות ותמונות כבדות */
    :root[data-eink] { --bg: #fff; --surface: #fff; --surface-2: #efefef; --ink: #000; --muted: #2b2b2b; --line: #000; --accent: #000; --accent-2: #000; --accent-ink: #fff; --accent-soft: #e6e6e6; --brass: #000; --rose: #000; --teal: #000; --danger: #000; --ok: #000; --warn: #000; --shadow: none; color-scheme: light; }

    :root[data-eink] .font-reading { font-size: 18.5px; line-height: 1.8; }
    body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.55; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
    /* טקסט לקריאה: תקצירים, הערות, שיחה */
    .font-reading { font-family: var(--font); font-size: 16.5px; line-height: 1.75; }

    .tabular { font-variant-numeric: tabular-nums; }
    .grid > *, main { min-width: 0; }
    html, body { overflow-x: hidden; }
    .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); }
    .safe-top { padding-top: env(safe-area-inset-top, 0px); }
    .clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .clamp-4 { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .fade-in { animation: fadeIn .18s ease-out both; }
    .sheet-in { animation: sheetIn .26s cubic-bezier(.2,.8,.2,1) both; }

    @keyframes sheetIn { from { transform: translateY(16px); opacity: .6; } to { transform: none; opacity: 1; } }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .fade-in, .sheet-in, .spin { animation: none; } }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    input, textarea, select, button { font: inherit; color: inherit; }
    .boot { display: grid; place-items: center; min-height: 100vh; color: var(--muted); font-size: 16px; padding-inline: 16px; text-align: center; }
    /* חלון ההמתנה לאימות: השלבים נדלקים אחד אחרי השני */
    .verify-dot { animation: verify-pulse 1.8s ease-in-out infinite; }
    .verify-line { background: linear-gradient(90deg, var(--line), var(--accent), var(--line)); background-size: 200% 100%; animation: verify-flow 1.8s linear infinite; }
    @keyframes verify-pulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 35%, transparent); } 50% { transform: scale(1.08); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 0%, transparent); } }
    @keyframes verify-flow { from { background-position: 200% 0; } to { background-position: 0 0; } }
    @media (prefers-reduced-motion: reduce) { .verify-dot, .verify-line { animation: none; } }
    [data-a11y] .verify-dot, [data-a11y] .verify-line, [data-eink] .verify-dot, [data-eink] .verify-line { animation: none; }

and origin","לפי שפה ומקור":"By language and origin","קצב לאורך התקופה":"Pace over the period","ספרים לפי זמן":"Books over time",ועוד:"And also","ספרים התחילו ועדיין בקריאה":"books started and still in progress",'ספרים נוספו לרשימת "רוצה לקרוא"':'books added to "Want to read"',"ספרים הופסקו באמצע":"books stopped midway","שיתוף כתמונה":"Share as an image","ספרים חדשים שנבחרו בשבילך":"New books picked for you","צעדים ראשונים":"Getting started","מה שנקרא שומרת את הספרים שקראת, לומדת את הטעם שלך וממליצה על הספר הבא. כל ספר נבדק מול מאגרים אמיתיים, כך שאין ספרים מומצאים.":"What We Read keeps the books you've read, learns your taste and recommends your next book. Every book is checked against real catalogues, so there are no made-up books.","איך מתחילים?":"How do I start?",'בוחרים שם (בלי סיסמה). בכניסה הראשונה נפתחת רשימה של 400 ספרים מוכרים: החלקה ימינה = קראתי, שמאלה = לא קראתי, והסימנייה = רוצה לקרוא. אפשר לדלג ולחזור אליה מהכרטיס שבראש "הספרים שלי".':'Choose a name (no password). On first entry a list of 400 well-known books opens: swipe right = read, left = not read, and the bookmark = want to read. You can skip it and come back from the card at the top of "My books".',"איך מתקינים את האפליקציה על מסך הבית?":"How do I install the app on my home screen?",'באייפון: פותחים ב-Safari, לוחצים על כפתור השיתוף ובוחרים "הוספה למסך הבית". באנדרואיד: בכרום, בתפריט ⋮ בוחרים "התקנת האפליקציה", או לוחצים על ההודעה שמופיעה באפליקציה.':'On iPhone: open it in Safari, tap the share button and choose "Add to Home Screen". On Android: in Chrome, choose "Install app" from the ⋮ menu, or tap the prompt that appears in the app.',"איך חוזרים לרשימת הספרים המוכרים?":"How do I get back to the well-known books list?",'בהגדרות ← "המלצות" ← "רשימת 400 הספרים המוכרים": "המשך מאיפה שעצרתי" או "מההתחלה". יש גם קישור בתחתית לשונית "הוספת ספר". ספרים שכבר בספרייה לא מוצגים שוב.':`In Settings → "Recommendations" → "The list of 400 well-known books": "Continue where I stopped" or "From the start". There's also a link at the bottom of the "Add a book" tab. Books already in your library aren't shown again.`,"כמה משתמשים יכולים להשתמש בה?":"How many people can use it?","כל אחד במשפחה מקבל ספרייה, דירוגים והמלצות משלו. מחליפים משתמש בלחיצה על השם שבראש המסך.":"Everyone in the family gets their own library, ratings and recommendations. Switch users by tapping the name at the top of the screen.","הנתונים שלי נשמרים?":"Is my data saved?","הכול נשמר בטלפון ומסתנכרן אוטומטית, כך שהספרייה זמינה בכל מכשיר. הנקודה הירוקה ליד השם אומרת שהכול מסונכרן; כתומה = אין חיבור כרגע, והנתונים יסונכרנו כשיחזור.":"Everything is saved on the phone and syncs automatically, so your library is available on every device. The green dot next to the name means everything is synced; orange = no connection right now, and the data will sync when it's back.","הספרייה האישית: ארבעה מדפים, חיפוש, מיון, תגיות וסטטיסטיקות.":"Your personal library: four shelves, search, sorting, tags and statistics.","מה ההבדל בין המדפים?":"What's the difference between the shelves?",'"קראתי" – ספרים שסיימת, עם דירוג. "קורא עכשיו" – ספרים שבאמצע. "רוצה לקרוא" – רשימת המשאלות. "קראתי חלקית" – ספרים שהפסקת באמצע (הדירוג רשות, ועוזר להמלצות).':'"Read" – books you finished, with a rating. "Reading now" – books in progress. "Want to read" – your wishlist. "Partly read" – books you stopped midway (the rating is optional and helps recommendations).',"איך מסמנים שסיימתי ספר?":"How do I mark a book as finished?",'בספר שנמצא ב"קורא עכשיו" יש כפתור "סיימתי". בוחרים מתי (היום, אתמול או חודש) ומדרגים.':'A book in "Reading now" has a "Finished" button. Choose when (today, yesterday or a month) and rate it.',"איך עורכים או מוחקים ספר?":"How do I edit or delete a book?",'לוחצים על הספר, ובחלון שנפתח בוחרים "עריכה" או "מחיקה".':'Tap the book, and in the window that opens choose "Edit" or "Delete".',"אפשר לראות את הספרים כקוביות?":"Can I see the books as a grid?","כן. ליד החיפוש יש מתג בין רשימה לקוביות, ותפריט מיון (חדשים, מתי קראתי, שנת הוצאה, דירוג, א–ת).":"Yes. Next to the search there's a list/grid switch and a sort menu (newest, when I read it, year published, rating, A–Z).","איפה הסטטיסטיקות?":"Where are the statistics?",'בראש "הספרים שלי": מספר הספרים, הדירוג הממוצע, האהובים והשנה, ו"סטטיסטיקות לפי ז\'אנר" עם פירוט לפי סוגה, מדינה, שנה וסופר.':'At the top of "My books": number of books, average rating, favourites and this year, plus "Statistics by genre" broken down by genre, country, year and author.',"מאיפה יודעים מאיזו מדינה כל ספר?":"How do you know which country each book is from?","המדינה נקבעת לפי הסופר/ת, אוטומטית ברקע. המדינה מופיעה ליד הספר, בסטטיסטיקות ובסיכום, וההמלצות מתחשבות בה.":"The country is set by the author, automatically in the background. It appears next to the book, in the statistics and in the summary, and recommendations take it into account.","הוספת ספרים":"Adding books","שלוש דרכים להוסיף: ספר אחד, רשימה, או טקסט חופשי. רק ספרים שנמצאו במאגרים נכנסים לספרייה.":"Three ways to add: one book, a list, or free text. Only books found in the catalogues go into your library.","איך מוסיפים ספר אחד?":"How do I add one book?",'בלשונית "הוספת ספר" כותבים שם בעברית או באנגלית, ISBN או קישור לדף הספר. בוחרים את הספר (ואם רוצים, את המהדורה המדויקת), ואז את המדף והדירוג.':`On the "Add a book" tab, type a title in English or Hebrew, an ISBN or a link to the book's page. Choose the book (and, if you like, the exact edition), then the shelf and rating.`,"יש לי רשימה של הרבה ספרים":"I have a list of many books",'בוחרים "רשימה" ומדביקים ספר בכל שורה (אפשר להוסיף מחבר אחרי מקף). עוברים על הספרים אחד אחרי השני, ואפשר לדייק או לחפש מחדש.':'Choose "List" and paste one book per line (you can add the author after a dash). Go through the books one by one; you can refine or search again.',"אפשר פשוט לכתוב מה קראתי?":"Can I just write what I've read?",'כן. ב"טקסט חופשי" כותבים בחופשיות, ו-Claude מזהה את הספרים. אחר כך בוחרים ומדרגים כל אחד.':'Yes. In "Free text" write freely, and Claude identifies the books. Then choose and rate each one.',"מאיפה מגיעים התקציר והקישורים לחנויות?":"Where do the descriptions and store links come from?",'לכל ספר האפליקציה מחפשת את דף הספר אצל ההוצאה ובחנויות (עברית, סטימצקי, צומת ספרים ועוד), ומשם מביאה את התקציר המקורי וקישור ישיר. התקציר מועתק מהדף כמו שהוא, ונבדק שהוא באמת מופיע שם. הכול נשמר עם הספר ומתעדכן מעצמו; אם לא נמצא, יש כפתור "חיפוש מחדש".':`For each book the app looks for its page at the publisher and in stores, and brings the original description and a direct link from there. The description is copied from the page as is, and checked that it really appears there. Everything is saved with the book and updates itself; if nothing is found, there's a "Search again" button.`,"למה ספר לא נמצא?":"Why wasn't a book found?",'כל ספר נבדק מול Google Books, הספרייה הלאומית, Open Library והחנויות. אפשר לנסות את השם המלא, איות אחר, את השם בשפת המקור, ISBN מהכריכה האחורית, או "זיהוי חכם".':'Every book is checked against Google Books, the National Library of Israel, Open Library and the stores. Try the full title, a different spelling, the title in the original language, the ISBN from the back cover, or "Smart identification".',"אפשר לייבא מ-Goodreads או StoryGraph?":"Can I import from Goodreads or StoryGraph?",'כן: הגדרות ← "ייצוא וייבוא" ← "ייבוא מקובץ CSV". כל ספר נבדק, ומה שלא אומת מחכה ברשימה בלשונית ההוספה.':`Yes: Settings → "My data" → "Import from a CSV file". Every book is checked, and whatever couldn't be verified waits in the list on the Add tab.`,"Claude קורא את הפרופיל הספרותי שלך וממליץ, וכל המלצה נבדקת מול המאגרים והחנויות לפני שהיא מוצגת.":"Claude reads your literary profile and recommends, and every recommendation is checked against the catalogues and stores before it's shown.","איך מקבלים המלצה?":"How do I get a recommendation?",'בלשונית "גלה ספר חדש" כותבים מה בא לך, בוחרים מיקוד (מצב רוח, ז\'אנר, תקופה ועוד) ולוחצים "המלצה חכמה". Claude ישאל 2–4 שאלות קצרות לדיוק (אפשר לדלג או להחליף שאלה).':'On the "Discover" tab, write what you feel like, pick a focus (mood, genre, period and more) and tap "Smart recommendation". Claude will ask 2–4 short questions to narrow it down (you can skip or swap a question).',"כמה זמן זה לוקח?":"How long does it take?","בדרך כלל דקה-שתיים. אפשר לצאת מהאפליקציה: ההמלצה ממשיכה בשרת, ואפשר לקבל התראה כשהיא מוכנה.":"Usually a minute or two. You can leave the app: the recommendation continues on the server, and you can get a notification when it's ready.","למה אפשר לסמוך על ההמלצות?":"Why can I trust the recommendations?","כל ספר שהמודל מציע נבדק מול הספרייה הלאומית, Google Books והחנויות; ספר שלא נמצא נפסל. בכל המלצה מופיעים זמינות (מודפס, דיגיטלי, קולי), קישורים לרכישה וביקורות מאתרים מוכרים.":"Every book the model suggests is checked against the National Library of Israel, Google Books and the stores; a book that isn't found is dropped. Each recommendation shows availability (print, e-book, audio), purchase links and reviews from well-known sites.","ההמלצות לא מתאימות לי":"The recommendations don't suit me",'כותבים בתיבה "לא בדיוק זה?" מה לא מתאים, ומקבלים הצעות מעודכנות. על ספר מסוים לוחצים "לא בשבילי" ובוחרים לחודש או לתמיד, עם הערה שמדייקת את הפרופיל.':`Write in the "Not quite it?" box what doesn't fit, and you'll get updated suggestions. On a specific book, tap "Not for me" and choose a month or forever, with a note that refines your profile.`,"איפה כל ההמלצות שקיבלתי?":"Where are all the recommendations I've received?",'בלשונית "גלה ספר חדש" ← "כל ההמלצות": כל ההמלצות מהשיחות ומההצעות הדו-שבועיות. מסמנים "טובה" או "לא טובה", ואפשר להוסיף למה (רשות). הטובות מופיעות למעלה, אלה שלא התאימו מוצנעות בסוף הרשימה, והסימונים מלמדים את ההמלצות הבאות ואת הפרופיל הספרותי.':`On the "Discover" tab → "All recommendations": every recommendation from your chats and the two-week suggestions. Mark "Good" or "Not good", and add why if you like. Good ones show at the top, the ones that didn't fit are tucked away at the end, and your marks teach the next recommendations and your literary profile.`,"באיזו שפה הספרים?":"What language are the books in?",'בשאלון מסמנים עברית, אנגלית ו/או שפות זרות. ברירת המחדל: עברית ואנגלית. משנים אותה בהגדרות ← "המלצות" ← "שפות ברירת המחדל להמלצות".':'In the questionnaire, tick English, Hebrew and/or other languages. The default is English. Change it in Settings → "Recommendations" → "Default languages for recommendations".','מה זה "ספר בשביל מישהו אחר"?':'What is "For someone else"?','מצב מתנה: מתארים את מי שמקבל את הספר, וההמלצה לא נשענת על הטעם שלך ולא משנה אותו. ספר שנשמר נכנס ל"רוצה לקרוא" עם התגית "מתנה".':`Gift mode: describe the person receiving the book, and the recommendation doesn't rely on your taste or change it. A saved book goes into "Want to read" with the tag "Gift".`,"מה זה הפרופיל הספרותי?":"What is the literary profile?",'תקציר של הטעם שלך, שנבנה מהספרים, מהדירוגים ומההערות, ומתעדכן לבד. הוא לוקח בחשבון מתי קראת כל ספר, כדי לזהות לאן הטעם מתפתח. בראש "גלה ספר חדש" הוא מקופל; לוחצים עליו כדי לקרוא, לעדכן או להוסיף הערה משלך.':`A summary of your taste, built from your books, ratings and notes, that updates itself. It takes into account when you read each book, to see where your taste is heading. At the top of "Discover" it's collapsed; tap it to read it, update it or add your own note.`,"מה ההצעות הדו-שבועיות?":"What are the two-week suggestions?","כל שבועיים נבחרים 10 ספרים חדשים לפי מה שקראת, בלי ספרים שכבר הוצעו או שקראת. הם מופיעים בראש המסך, ואפשר לקבל התראה.":"Every two weeks, 10 new books are picked based on what you've read, without books already suggested or read. They show at the top of the screen, and you can get a notification.","דוח על הקריאה שלך: כמה, מה, מתי ואיך, לשבועיים, לחודש, לשנה או לכל הזמן.":"A report on your reading: how much, what, when and how, for two weeks, a month, a year or all time.","איפה הסיכום?":"Where's the summary?",'כשיש סיכום חדש מופיע כרטיס בראש "הספרים שלי". אחרי שצפית בו, הוא עובר לקישור "סיכום הקריאה" ליד הסטטיסטיקות.':`When there's a new summary, a card appears at the top of "My books". After you've viewed it, it moves to a "Reading summary" link next to the statistics.`,"מה יש בו?":"What's in it?","ספרים ועמודים (בהשוואה לתקופה הקודמת), דירוג ממוצע וקצב, סוג הקריאה, הספר של התקופה, סוגות, עשורי כתיבה, סופרים, התפלגות דירוגים, אורך, שפה ומקור, וקצב לאורך התקופה.":"Books and pages (compared with the previous period), average rating and pace, your reading type, the book of the period, genres, decades written, authors, rating distribution, length, language and origin, and pace over the period.","למה חלק מהספרים לא נספרים?":"Why aren't some books counted?","הסיכום סופר רק ספרים עם תאריך סיום. ספרים שסומנו מרשימת המוכרים אין להם תאריך; אפשר לערוך ספר ולבחור מתי קראת אותו.":"The summary counts only books with a finish date. Books marked from the well-known list have no date; you can edit a book and choose when you read it.","אפשר לשתף?":"Can I share it?",'כן: "שיתוף כתמונה" בסוף הסיכום יוצר תמונה לשיתוף או לשמירה.':'Yes: "Share as an image" at the end of the summary creates an image to share or save.',"רואים מה החברים קוראים ואוהבים, ממליצים אחד לשני ומגלים ספרים דרכם.":"See what friends are reading and loving, recommend to each other and discover books through them.","איך מוסיפים חבר?":"How do I add a friend?",'בלשונית "חברים" ← "להוסיף חברים" ← "בקשת חברות". אחרי שהחבר מאשר, רואים את המדפים שלו.':'On the "Friends" tab → "Add friends" → "Friend request". Once they accept, you can see their shelves.',"מה החברים רואים עליי?":"What do friends see about me?",'בוחרים בהגדרות ← "פרטיות וחברים": ספרים שקראת ודירוגים, רשימת "רוצה לקרוא", הערות, והופעה בלי שם ב"אהובים בקהילה".':`You choose in Settings → "Privacy and friends": books you've read and ratings, your "Want to read" list, notes, and appearing anonymously in "Community favourites".`,"איך ממליצים לחבר?":"How do I recommend to a friend?",'במדף של חבר או בספר שלך לוחצים "להמליץ", בוחרים חבר (או כל החברים) ומוסיפים משפט.':`On a friend's shelf or on your own book, tap "Recommend", choose a friend (or all friends) and add a sentence.`,"התראה כשההמלצה מוכנה, וכשמגיעים הסיכום וההצעות הדו-שבועיות.":"A notification when a recommendation is ready, and when the summary and two-week suggestions arrive.","איך מפעילים התראות?":"How do I turn on notifications?",'בהגדרות ← "התראות" ← "התראה כשיש הצעות חדשות", ומאשרים בחלון של הטלפון. אפשר גם מהשורה שמופיעה בזמן שההמלצה מתגבשת.':`In Settings → "Notifications" → "Notify me about new suggestions", and allow it in the phone's prompt. You can also do it from the line that appears while a recommendation is being prepared.`,"באייפון לא מגיעות התראות":"Notifications don't arrive on iPhone","באייפון התראות עובדות רק אחרי התקנה על מסך הבית (iOS 16.4 ומעלה), ורק כשפותחים את האפליקציה משם.":"On iPhone, notifications work only after installing to the home screen (iOS 16.4 or later), and only when you open the app from there.","אפשר להתאים את המראה, הגופן והגודל, ולהפעיל מצב נגישות.":"You can adjust the look, font and size, and turn on accessibility mode.","איך משנים צבעים?":"How do I change the colors?",'בהגדרות ← "תצוגה ונגישות": שש ערכות (נייר וקלף, ספרייה ישנה, דיו כחול, אבן ירושלמית, שזיף ולבנדר, ים תיכון) או "מתחלף כל יום", ובחירה בין בהיר, כהה או לפי המכשיר.':'In Settings → "Display and accessibility": six themes (Paper and parchment, Old library, Blue ink, Jerusalem stone, Plum and lavender, Mediterranean) or "Changes every day", and a choice of light, dark or match device.',"איך מגדילים את הטקסט?":"How do I make the text bigger?",'בהגדרות ← "תצוגה ונגישות" ← "גודל הטקסט": א+ להגדלה וא- להקטנה, מ-90% עד 150%. אפשר גם לבחור גופן: פרנק רוהל, דוד, אסיסטנט או אלף.':'In Settings → "Display and accessibility" → "Text size": A+ to enlarge and A− to shrink, from 90% to 150%. You can also choose a font: Frank Ruhl, David, Assistant or Alef.',"מה עושה מצב נגישות?":"What does accessibility mode do?",'ניגודיות גבוהה, טקסט גדול יותר, קישורים עם קו תחתון, מסגרת מיקוד בולטת, בלי אנימציות ואזורי לחיצה גדולים, לפי ת"י 5568 ו-WCAG 2.0 AA. האפליקציה עובדת גם עם קורא מסך ומקלדת.':"High contrast, larger text, underlined links, a clear focus outline, no animations and larger tap areas, per IS 5568 and WCAG 2.0 AA. The app also works with a screen reader and keyboard.","יש לי קורא ספרים אלקטרוני":"I have an e-reader",'"מצב קורא אלקטרוני" בהגדרות ← "תצוגה ונגישות": שחור-לבן, טקסט גדול, בלי אנימציות ותמונות כבדות. נשמר רק במכשיר שבו הופעל.':`"E-reader mode" in Settings → "Display and accessibility": black and white, large text, no animations or heavy images. It's saved only on the device where you turned it on.`,"איך מתמצאים בהגדרות?":"How are the settings organized?","ההגדרות מחולקות לקבוצות: החשבון שלי, המלצות, התראות, תצוגה ונגישות, משוב, פרטיות וחברים, הנתונים שלי. כל קבוצה מקופלת ונפתחת בלחיצה, והאפליקציה זוכרת אילו קבוצות פתחת.":"Settings are split into groups: My account, Recommendations, Notifications, Display and accessibility, Feedback, Privacy and friends, My data. Each group is collapsed and opens with a tap, and the app remembers which groups you opened.","איך עוברים לאנגלית?":"How do I change the language?",'בהגדרות ← "החשבון שלי" ← "שפה · Language" בוחרים English (או עברית). אפשר לבחור גם במסך הכניסה. האפליקציה נטענת מחדש בשפה שנבחרה, וההמלצות וההצעות הדו-שבועיות נכתבות בה.':'In Settings → "My account" → "שפה · Language", choose English or עברית (Hebrew). You can also choose on the sign-in screen. The app reloads in the chosen language, and recommendations and two-week suggestions are written in it.',"איך האפליקציה פונה אליי?":"How does the app address me?",'בהגדרות ← "החשבון שלי" ← "איך לפנות אליך?": לשון נקבה, זכר או רבים. כל הטקסטים וההמלצות מתאימים את עצמם.':'In Hebrew, you can choose feminine, masculine or plural address in Settings → "My account".',"הנתונים והפרטיות":"Data and privacy","רואים מה האפליקציה יודעת, מוחקים, מייצאים ומייבאים.":"See what the app knows, delete, export and import.","מה האפליקציה יודעת עליי?":"What does the app know about me?",'בהגדרות ← "הנתונים שלי" ← "מה האפליקציה יודעת עליי": הפרופיל הספרותי, ההערה שלך, המשובים והספרים שנשללו. אפשר למחוק כל פריט.':'In Settings → "My data" → "What the app knows about me": your literary profile, your note, feedback and rejected books. You can delete any item.',"איך מייצאים את הנתונים?":"How do I export my data?",'בהגדרות ← "הנתונים שלי": קובץ CSV שמתאים ל-Goodreads ול-StoryGraph. ב"גיבוי ידני" יש גם גיבוי מלא (JSON) ורשימה כטקסט.':'In Settings → "My data": a CSV file that works with Goodreads and StoryGraph. "Manual backup" also has a full backup (JSON) and a list as text.',"משהו לא עובד":"Something isn't working",'בהגדרות ← "משוב" כותבים מה קרה, וזה מגיע ישר ליובל.':'In Settings → "Feedback", write what happened; it goes straight to Yuval.',"מדריך למשתמש":"User guide","סגירת המדריך":"Close the guide","חיפוש במדריך":"Search the guide","חיפוש: למשל התראות, ייבוא, גודל טקסט":"Search: e.g. notifications, import, text size",נושאים:"Topics","לא נמצאה תשובה. אפשר לכתוב לנו בתיבת המשוב שבהגדרות.":"No answer found. You can write to us in the feedback box in Settings.","ספרים חדשים בשבילך":"New books for you","לפי הספרים שקראת וההעדפות שלך":"Based on the books you've read and your preferences","ההצעות של {0}":"Suggestions for {0}","לא נציע אותו שוב.":"We won't suggest it again.","השינויים נשמרו":"Changes saved",'"{0}" נוסף לרשימת "רוצה לקרוא"':'"{0}" added to "Want to read"','"{0}" נוסף ל"{1}". קריאה נעימה!':'"{0}" added to "{1}". Enjoy!','"{0}" נשמר בספרייה':'"{0}" saved to your library',"החלפת משתמש":"Switch user","היכרות עם הטעם שלך":"Getting to know your taste","הספר נמחק":"Book deleted","ניווט ראשי":"Main navigation","{0} חדשים":"{0} new",מסונכרן:"Synced","מסתנכרן…":"Syncing…","אין חיבור, נשמר בטלפון":"Offline, saved on the phone","מה קראת, מה תקרא, ומה החברים אוהבים":"What you've read, what you'll read, and what friends love","של מי הספרייה?":"Whose library is this?","במכשיר כבר יש ספרייה עם":"This device already has a library with","ספרים. היא וא. אפשר לדלג ולחזור אליה מהכרטיס שבראש "הספרים שלי".')],[t("איך מתקינים את האפליקציה על מסך הבית?"),t('באייפון: פותחים ב-Safari, לוחצים על כפתור השיתוף ובוחרים "הוספה למסך הבית". באנדרואיד: בכרום, בתפריט ⋮ בוחרים "התקנת האפליקציה", או לוחצים על ההודעה שמופיעה באפליקציה.')],[t("איך חוזרים לרשימת הספרים המוכרים?"),t('בהגדרות ← "המלצות" ← "רשימת 400 הספרים המוכרים": "המשך מאיפה שעצרתי" או "מההתחלה". יש גם קישור בתחתית לשונית "הוספת ספר". ספרים שכבר בספרייה לא מוצגים שוב.')],[t("איך עובדת הסיסמה?"),t('כל משתמש בוחר סיסמה כשהוא נכנס בפעם הראשונה. המכשיר זוכר מי נכנס ממנו ופותח ישר את הספרייה שלו; אחרי "החלפת משתמש" צריך את הסיסמה שוב. משנים סיסמה בהגדרות ← "החשבון שלי". שכחתם? "שכחתי סיסמה" במסך הכניסה, עם סיסמת המנהל.')],[t("כמה משתמשים יכולים להשתמש בה?"),t("כל אחד במשפחה מקבל ספרייה, דירוגים והמלצות משלו. מחליפים משתמש בלחיצה על השם שבראש המסך.")],[t("הנתונים שלי נשמרים?"),t("הכול נשמר בטלפון ומסתנכרן אוטומטית, כך שהספרייה זמינה בכל מכשיר. הנקודה הירוקה ליד השם אומרת שהכול מסונכרן; כתומה = אין חיבור כרגע, והנתונים יסונכרנו כשיחזור.")]]},{id:"library",title:t("הספרים שלי"),icon:"Library",intro:t("הספרייה האישית: ארבעה מדפים, חיפוש, מיון, תגיות וסטטיסטיקות."),qa:[[t("מה ההבדל בין המדפים?"),t('"קראתי" – ספרים שסיימת, עם דירוג. "קורא עכשיו" – ספרים שבאמצע. "רוצה לקרוא" – רשימת המשאלות. "קראתי חלקית" – ספרים שהפסקת באמצע (הדירוג רשות, ועוזר להמלצות).')],[t("אפשר לסמן סדרה שלמה?"),t('כן. כשספר הוא חלק מסדרה, מופיע בחלון שלו (וגם בתוצאות החיפוש) "ספר X מתוך Y בסדרה". לוחצים "סימון כל הסדרה", בוחרים אילו ספרים, מדף ודירוג, וכל ספר נבדק במאגרים לפני שהוא נכנס. המידע על הסדרות מגיע מ-Wikidata, ומוצג רק כשהוא חד-משמעי: אותו מחבר, ומספר לכל ספר בסדרה.')],[t("איך מסמנים שסיימתי ספר?"),t('בספר שנמצא ב"קורא עכשיו" יש כפתור "סיימתי". בוחרים מתי (היום, אתמול או חודש) ומדרגים.')],[t("איך עורכים או מוחקים ספר?"),t('לוחצים על הספר, ובחלון שנפתח בוחרים "עריכה" או "מחיקה".')],[t("אפשר לראות את הספרים כקוביות?"),t("כן. ליד החיפוש יש מתג בין רשימה לקוביות, ותפריט מיון (חדשים, מתי קראתי, שנת הוצאה, דירוג, א–ת).")],[t("איפה הסטטיסטיקות?"),t(`בראש "הספרים שלי": מספר הספרים, הדירוג הממוצע, האהובים והשנה, ו"סטטיסטיקות לפי ז'אנר" עם פירוט לפי סוגה, מדינה, שנה וסופר.`)],[t("מאיפה יודעים מאיזו מדינה כל ספר?"),t("המדינה נקבעת לפי הסופר/ת, אוטומטית ברקע. המדינה מופיעה ליד הספר, בסטטיסטיקות ובסיכום, וההמלצות מתחשבות בה.")]]},{id:"add",title:t("הוספת ספרים"),icon:"BookPlus",intro:t("שלוש דרכים להוסיף: ספר אחד, רשימה, או טקסט חופשי. רק ספרים שנמצאו במאגרים נכנסים לספרייה."),qa:[[t("איך מוסיפים ספר אחד?"),t('בלשונית "הוספת ספר" כותבים שם בעברית או באנגלית, ISBN או קישור לדף הספר. בוחרים את הספר (ואם רוצים, את המהדורה המדויקת), ואז את המדף והדירוג.')],[t("יש לי רשימה של הרבה ספרים"),t('בוחרים "רשימה" ומדביקים ספר בכל שורה (אפשר להוסיף מחבר אחרי מקף). עוברים על הספרים אחד אחרי השני, ואפשר לדייק או לחפש מחדש.')],[t("אפשר פשוט לכתוב מה קראתי?"),t('כן. ב"טקסט חופשי" כותבים בחופשיות, ו-Claude מזהה את הספרים. אחר כך בוחרים ומדרגים כל אחד.')],[t("מאיפה מגיעים התקציר והקישורים לחנויות?"),t('לכל ספר האפליקציה מחפשת את דף הספר אצל ההוצאה ובחנויות (עברית, סטימצקי, צומת ספרים ועוד), ומשם מביאה את התקציר המקורי וקישור ישיר. התקציר מועתק מהדף כמו שהוא, ונבדק שהוא באמת מופיע שם. הכול נשמר עם הספר ומתעדכן מעצמו; אם לא נמצא, יש כפתור "חיפוש מחדש".')],[t("למה ספר לא נמצא?"),t('כל ספר נבדק מול Google Books, הספרייה הלאומית, Open Library והחנויות. אפשר לנסות את השם המלא, איות אחר, את השם בשפת המקור, ISBN מהכריכה האחורית, או "זיהוי חכם".')],[t("אפשר לייבא מ-Goodreads או StoryGraph?"),t('כן: הגדרות ← "ייצוא וייבוא" ← "ייבוא מקובץ CSV". כל ספר נבדק, ומה שלא אומת מחכה ברשימה בלשונית ההוספה.')]]},{id:"recs",title:t("המלצות"),icon:"Sparkles",intro:t("Claude קורא את הפרופיל הספרותי שלך וממליץ, וכל המלצה נבדקת מול המאגרים והחנויות לפני שהיא מוצגת."),qa:[[t("איך מקבלים המלצה?"),t(`בלשונית "גלה ספר חדש" כותבים מה בא לך, בוחרים מיקוד (מצב רוח, ז'אנר, תקופה ועוד) ולוחצים "המלצה חכמה". Claude ישאל 2–4 שאלות קצרות לדיוק (אפשר לדלג או להחליף שאלה).`)],[t("כמה זמן זה לוקח?"),t("בדרך כלל דקה-שתיים. אפשר לצאת מהאפליקציה: ההמלצה ממשיכה בשרת, ואפשר לקבל התראה כשהיא מוכנה.")],[t("למה אפשר לסמוך על ההמלצות?"),t("כל ספר שהמודל מציע נבדק מול הספרייה הלאומית, Google Books והחנויות; ספר שלא נמצא נפסל. בכל המלצה מופיעים זמינות (מודפס, דיגיטלי, קולי), קישורים לרכישה וביקורות מאתרים מוכרים.")],[t("ההמלצות לא מתאימות לי"),t('כותבים בתיבה "לא בדיוק זה?" מה לא מתאים, ומקבלים הצעות מעודכנות. על ספר מסוים לוחצים "לא בשבילי" ובוחרים לחודש או לתמיד, עם הערה שמדייקת את הפרופיל.')],[t("איפה כל ההמלצות שקיבלתי?"),t('בלשונית "גלה ספר חדש" ← "כל ההמלצות": כל ההמלצות מהשיחות ומההצעות הדו-שבועיות. מסמנים "טובה" או "לא טובה", ואפשר להוסיף למה (רשות). הטובות מופיעות למעלה, אלה שלא התאימו מוצנעות בסוף הרשימה, והסימונים מלמדים את ההמלצות הבאות ואת הפרופיל הספרותי.')],[t("באיזו שפה הספרים?"),t('בשאלון מסמנים עברית, אנגלית ו/או שפות זרות. ברירת המחדל: עברית ואנגלית. משנים אותה בהגדרות ← "המלצות" ← "שפות ברירת המחדל להמלצות".')],[t('מה זה "ספר בשביל מישהו אחר"?'),t('מצב מתנה: מתארים את מי שמקבל את הספר, וההמלצה לא נשענת על הטעם שלך ולא משנה אותו. ספר שנשמר נכנס ל"רוצה לקרוא" עם התגית "מתנה".')],[t("איך ההמלצות מתחשבות במתי קראתי?"),t("לכל ספר יש משקל: כמה אהבת אותו, כפול כמה הוא עדכני. ספר מאתמול שווה פי שניים מספר מלפני 3 שנים, ופי 8 בערך מספר מלפני 10 שנים. למודל נשלחים רק הספרים שהכי מעידים על הטעם שלך היום, וכך ההמלצה מדויקת וזולה יותר.")],[t("אפשר שההמלצות לא יתחשבו בספר מסוים?"),t('כן. לוחצים על הספר ומכבים "להתחשב בספר בהמלצות". הספר נשאר בספרייה ולא יומלץ שוב, אבל לא משפיע על הטעם. כשמסמנים ספר שנקרא לפני 5 שנים ויותר, האפליקציה שואלת על כך בעצמה.')],[t("מה זה הפרופיל הספרותי?"),t('תקציר של הטעם שלך, שנבנה מהספרים, מהדירוגים ומההערות, ומתעדכן לבד. הוא לוקח בחשבון מתי קראת כל ספר, כדי לזהות לאן הטעם מתפתח. בראש "גלה ספר חדש" הוא מקופל; לוחצים עליו כדי לקרוא, לעדכן או להוסיף הערה משלך.')],[t("מה ההצעות הדו-שבועיות?"),t("כל שבועיים נבחרים 10 ספרים חדשים לפי מה שקראת, בלי ספרים שכבר הוצעו או שקראת. הם מופיעים בראש המסך, ואפשר לקבל התראה.")]]},{id:"summary",title:t("סיכום הקריאה"),icon:"ChartColumn",intro:t("דוח על הקריאה שלך: כמה, מה, מתי ואיך, לשבועיים, לחודש, לשנה או לכל הזמן."),qa:[[t("איפה הסיכום?"),t('כשיש סיכום חדש מופיע כרטיס בראש "הספרים שלי". אחרי שצפית בו, הוא עובר לקישור "סיכום הקריאה" ליד הסטטיסטיקות.')],[t("מה יש בו?"),t("ספרים ועמודים (בהשוואה לתקופה הקודמת), דירוג ממוצע וקצב, סוג הקריאה, הספר של התקופה, סוגות, עשורי כתיבה, סופרים, התפלגות דירוגים, אורך, שפה ומקור, וקצב לאורך התקופה.")],[t("למה חלק מהספרים לא נספרים?"),t("הסיכום סופר רק ספרים עם תאריך סיום. ספרים שסומנו מרשימת המוכרים אין להם תאריך; אפשר לערוך ספר ולבחור מתי קראת אותו.")],[t("אפשר לשתף?"),t('כן: "שיתוף כתמונה" בסוף הסיכום יוצר תמונה לשיתוף או לשמירה.')]]},{id:"friends",title:t("חברים"),icon:"Users",intro:t("רואים מה החברים קוראים ואוהבים, ממליצים אחד לשני ומגלים ספרים דרכם."),qa:[[t("איך מוסיפים חבר?"),t('בלשונית "חברים" ← "להוסיף חברים" ← "בקשת חברות". אחרי שהחבר מאשר, רואים את המדפים שלו.')],[t("איך מסתירים ספר מסוים מחברים?"),t('לוחצים על הספר ב"הספרים שלי" ומפעילים "הסתרה מחברים". הספר נשאר אצלך, אבל לא מופיע במדף שלך אצל החברים, בהמלצות שלהם וב"אהובים בקהילה". ליד ספר מוסתר מופיע סימן של עין מחוקה.')],[t("מה החברים רואים עליי?"),t('בוחרים בהגדרות ← "פרטיות וחברים": ספרים שקראת ודירוגים, רשימת "רוצה לקרוא", הערות, והופעה בלי שם ב"אהובים בקהילה".')],[t("איך ממליצים לחבר?"),t('במדף של חבר או בספר שלך לוחצים "להמליץ", בוחרים חבר (או כל החברים) ומוסיפים משפט.')]]},{id:"notify",title:t("התראות"),icon:"Bell",intro:t("התראה כשההמלצה מוכנה, וכשמגיעים הסיכום וההצעות הדו-שבועיות."),qa:[[t("איך מפעילים התראות?"),t('בהגדרות ← "התראות" ← "התראה כשיש הצעות חדשות", ומאשרים בחלון של הטלפון. אפשר גם מהשורה שמופיעה בזמן שההמלצה מתגבשת.')],[t("באייפון לא מגיעות התראות"),t("באייפון התראות עובדות רק אחרי התקנה על מסך הבית (iOS 16.4 ומעלה), ורק כשפותחים את האפליקציה משם.")]]},{id:"look",title:t("תצוגה ונגישות"),icon:"Palette",intro:t("אפשר להתאים את המראה, הגופן והגודל, ולהפעיל מצב נגישות."),qa:[[t("איך משנים צבעים?"),t('בהגדרות ← "תצוגה ונגישות": שש ערכות (נייר וקלף, ספרייה ישנה, דיו כחול, אבן ירושלמית, שזיף ולבנדר, ים תיכון) או "מתחלף כל יום", ובחירה בין בהיר, כהה או לפי המכשיר.')],[t("איך מגדילים את הטקסט?"),t('בהגדרות ← "תצוגה ונגישות" ← "גודל הטקסט": א+ להגדלה וא- להקטנה, מ-90% עד 150%. אפשר גם לבחור גופן: פרנק רוהל, דוד, אסיסטנט או אלף.')],[t("מה עושה מצב נגישות?"),t('ניגודיות גבוהה, טקסט גדול יותר, קישורים עם קו תחתון, מסגרת מיקוד בולטת, בלי אנימציות ואזורי לחיצה גדולים, לפי ת"י 5568 ו-WCAG 2.0 AA. האפליקציה עובדת גם עם קורא מסך ומקלדת.')],[t("יש לי קורא ספרים אלקטרוני"),t('"מצב קורא אלקטרוני" בהגדרות ← "תצוגה ונגישות": שחור-לבן, טקסט גדול, בלי אנימציות ותמונות כבדות. נשמר רק במכשיר שבו הופעל.')],[t("איך מתמצאים בהגדרות?"),t("ההגדרות מחולקות לקבוצות: החשבון שלי, המלצות, התראות, תצוגה ונגישות, משוב, פרטיות וחברים, הנתונים שלי. כל קבוצה מקופלת ונפתחת בלחיצה, והאפליקציה זוכרת אילו קבוצות פתחת.")],[t("איך עוברים לאנגלית?"),t('בהגדרות ← "החשבון שלי" ← "שפה · Language" בוחרים English (או עברית). אפשר לבחור גם במסך הכניסה. האפליקציה נטענת מחדש בשפה שנבחרה, וההמלצות וההצעות הדו-שבועיות נכתבות בה.')],...te?[]:[[t("איך האפליקציה פונה אליי?"),t('בהגדרות ← "החשבון שלי" ← "איך לפנות אליך?": לשון נקבה, זכר או רבים. כל הטקסטים וההמלצות מתאימים את עצמם.')]]]},{id:"data",title:t("הנתונים והפרטיות"),icon:"Shield",intro:t("רואים מה האפליקציה יודעת, מוחקים, מייצאים ומייבאים."),qa:[[t("מה האפליקציה יודעת עליי?"),t('בהגדרות ← "הנתונים שלי" ← "מה האפליקציה יודעת עליי": הפרופיל הספרותי, ההערה שלך, המשובים והספרים שנשללו. אפשר למחוק כל פריט.')],[t("איך מייצאים את הנתונים?"),t('בהגדרות ← "הנתונים שלי": קובץ CSV שמתאים ל-Goodreads ול-StoryGraph. ב"גיבוי ידני" יש גם גיבוי מלא (JSON) ורשימה כטקסט.')],[t("משהו לא עובד"),t('בהגדרות ← "משוב" כותבים מה קרה, וזה מגיע ישר ליובל.')]]}];function yl({onClose:e}){let[a,n]=T(""),o=Ne({});Z(()=>{let l=m=>{m.key==="Escape"&&e()};return document.addEventListener("keydown",l),()=>document.removeEventListener("keydown",l)},[]);let s=le(a.trim()),r=no.map(l=>({...l,qa:s?l.qa.filter(([m,c])=>le(m+" "+c+" "+l.title).includes(s)):l.qa})).fil
