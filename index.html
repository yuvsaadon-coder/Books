יחזור."]]},{id:"library",title:"הספרים שלי",icon:"Library",intro:"הספרייה האישית: ארבעה מדפים, חיפוש, מיון, תגיות וסטטיסטיקות.",qa:[["מה ההבדל בין המדפים?",'"קראתי" – ספרים שסיימת, עם דירוג. "קורא עכשיו" – ספרים שבאמצע. "רוצה לקרוא" – רשימת המשאלות. "קראתי חלקית" – ספרים שהפסקת באמצע (הדירוג רשות, ועוזר להמלצות).'],["איך מסמנים שסיימתי ספר?",'בספר שנמצא ב"קורא עכשיו" יש כפתור "סיימתי". בוחרים מתי (היום, אתמול או חודש) ומדרגים.'],["איך עורכים או מוחקים ספר?",'לוחצים על הספר, ובחלון שנפתח בוחרים "עריכה" או "מחיקה".'],["אפשר לראות את הספרים כקוביות?","כן. ליד החיפוש יש מתג בין רשימה לקוביות, ותפריט מיון (חדשים, מתי קראתי, שנת הוצאה, דירוג, א–ת)."],["איפה הסטטיסטיקות?",`בראש "הספרים שלי": מספר הספרים, הדירוג הממוצע, האהובים והשנה, ו"סטטיסטיקות לפי ז'אנר" עם פירוט לפי סוגה, שנה וסופר.`]]},{id:"add",title:"הוספת ספרים",icon:"BookPlus",intro:"שלוש דרכים להוסיף: ספר אחד, רשימה, או טקסט חופשי. רק ספרים שנמצאו במאגרים נכנסים לספרייה.",qa:[["איך מוסיפים ספר אחד?",'בלשונית "הוספת ספר" כותבים שם בעברית או באנגלית, ISBN או קישור לדף הספר. בוחרים את הספר (ואם רוצים, את המהדורה המדויקת), ואז את המדף והדירוג.'],["יש לי רשימה של הרבה ספרים",'בוחרים "רשימה" ומדביקים ספר בכל שורה (אפשר להוסיף מחבר אחרי מקף). עוברים על הספרים אחד אחרי השני, ואפשר לדייק או לחפש מחדש.'],["אפשר פשוט לכתוב מה קראתי?",'כן. ב"טקסט חופשי" כותבים בחופשיות, ו-Claude מזהה את הספרים. אחר כך בוחרים ומדרגים כל אחד.'],["למה ספר לא נמצא?",'כל ספר נבדק מול Google Books, הספרייה הלאומית, Open Library והחנויות. אפשר לנסות את השם המלא, איות אחר, את השם בשפת המקור, ISBN מהכריכה האחורית, או "זיהוי חכם".'],["אפשר לייבא מ-Goodreads או StoryGraph?",'כן: הגדרות ← "ייצוא וייבוא" ← "ייבוא מקובץ CSV". כל ספר נבדק, ומה שלא אומת מחכה ברשימה בלשונית ההוספה.']]},{id:"recs",title:"המלצות",icon:"Sparkles",intro:"Claude קורא את הפרופיל הספרותי שלך וממליץ, וכל המלצה נבדקת מול המאגרים והחנויות לפני שהיא מוצגת.",qa:[["איך מקבלים המלצה?",`בלשונית "גלה ספר חדש" כותבים מה בא לך, בוחרים מיקוד (מצב רוח, ז'אנר, תקופה ועוד) ולוחצים "המלצה חכמה". Claude ישאל 2–4 שאלות קצרות לדיוק (אפשר לדלג או להחליף שאלה).`],["כמה זמן זה לוקח?","בדרך כלל דקה-שתיים. אפשר לצאת מהאפליקציה: ההמלצה ממשיכה בשרת, ואפשר לקבל התראה כשהיא מוכנה."],["למה אפשר לסמוך על ההמלצות?","כל ספר שהמודל מציע נבדק מול הספרייה הלאומית, Google Books והחנויות; ספר שלא נמצא נפסל. בכל המלצה מופיעים זמינות (מודפס, דיגיטלי, קולי), קישורים לרכישה וביקורות מאתרים מוכרים."],["ההמלצות לא מתאימות לי",'כותבים בתיבה "לא בדיוק זה?" מה לא מתאים, ומקבלים הצעות מעודכנות. על ספר מסוים לוחצים "לא בשבילי" ובוחרים לחודש או לתמיד, עם הערה שמדייקת את הפרופיל.'],["באיזו שפה הספרים?",'כברירת מחדל רק ספרים שיש להם מהדורה בעברית. אפשר לשנות ל"עברית ואנגלית", "אנגלית" או "כל שפה".'],['מה זה "ספר בשביל מישהו אחר"?','מצב מתנה: מתארים את מי שמקבל את הספר, וההמלצה לא נשענת על הטעם שלך ולא משנה אותו. ספר שנשמר נכנס ל"רוצה לקרוא" עם התגית "מתנה".'],["מה זה הפרופיל הספרותי?","תקציר של הטעם שלך, שנבנה מהספרים, מהדירוגים ומההערות, ומתעדכן לבד. הוא לוקח בחשבון מתי קראת כל ספר, כדי לזהות לאן הטעם מתפתח. אפשר להוסיף לו הערה משלך."],["מה ההצעות הדו-שבועיות?","כל שבועיים נבחרים 10 ספרים חדשים לפי מה שקראת, בלי ספרים שכבר הוצעו או שקראת. הם מופיעים בראש המסך, ואפשר לקבל התראה."]]},{id:"summary",title:"סיכום הקריאה",icon:"ChartColumn",intro:"דוח על הקריאה שלך: כמה, מה, מתי ואיך, לשבועיים, לחודש, לשנה או לכל הזמן.",qa:[["איפה הסיכום?",'כשיש סיכום חדש מופיע כרטיס בראש "הספרים שלי". אחרי שצפית בו, הוא עובר לקישור "סיכום הקריאה" ליד הסטטיסטיקות.'],["מה יש בו?","ספרים ועמודים (בהשוואה לתקופה הקודמת), דירוג ממוצע וקצב, סוג הקריאה, הספר של התקופה, סוגות, עשורי כתיבה, סופרים, התפלגות דירוגים, אורך, שפה ומקור, וקצב לאורך התקופה."],["למה חלק מהספרים לא נספרים?","הסיכום סופר רק ספרים עם תאריך סיום. ספרים שסומנו מרשימת המוכרים אין להם תאריך; אפשר לערוך ספר ולבחור מתי קראת אותו."],["אפשר לשתף?",'כן: "שיתוף כתמונה" בסוף הסיכום יוצר תמונה לשיתוף או לשמירה.']]},{id:"friends",title:"חברים",icon:"Users",intro:"רואים מה החברים קוראים ואוהבים, ממליצים אחד לשני ומגלים ספרים דרכם.",qa:[["איך מוסיפים חבר?",'בלשונית "חברים" ← "להוסיף חברים" ← "בקשת חברות". אחרי שהחבר מאשר, רואים את המדפים שלו.'],["מה החברים רואים עליי?",'בוחרים בהגדרות ← "פרטיות וחברים": ספרים שקראת ודירוגים, רשימת "רוצה לקרוא", הערות, והופעה בלי שם ב"אהובים בקהילה".'],["איך ממליצים לחבר?",'במדף של חבר או בספר שלך לוחצים "להמליץ", בוחרים חבר (או כל החברים) ומוסיפים משפט.']]},{id:"notify",title:"התראות",icon:"Bell",intro:"התראה כשההמלצה מוכנה, וכשמגיעים הסיכום וההצעות הדו-שבועיות.",qa:[["איך מפעילים התראות?",'בהגדרות ← "התראות" ← "התראה כשיש הצעות חדשות", ומאשרים בחלון של הטלפון. אפשר גם מהשורה שמופיעה בזמן שההמלצה מתגבשת.'],["באייפון לא מגיעות התראות","באייפון התראות עובדות רק אחרי התקנה על מסך הבית (iOS 16.4 ומעלה), ורק כשפותחים את האפליקציה משם."]]},{id:"look",title:"תצוגה ונגישות",icon:"Palette",intro:"אפשר להתאים את המראה, הגופן והגודל, ולהפעיל מצב נגישות.",qa:[["איך משנים צבעים?",'בהגדרות ← "תצוגה ונגישות": ארבע ערכות (נייר וקלף, ספרייה ישנה, דיו כחול, אבן ירושלמית) או "מתחלף כל יום", ובחירה בין בהיר, כהה או לפי המכשיר.'],["איך מגדילים את הטקסט?",'בהגדרות ← "גודל הטקסט": א+ להגדלה וא- להקטנה, מ-90% עד 150%. אפשר גם לבחור גופן: פרנק רוהל, דוד, אסיסטנט או אלף.'],["מה עושה מצב נגישות?",'ניגודיות גבוהה, טקסט גדול יותר, קישורים עם קו תחתון, מסגרת מיקוד בולטת, בלי אנימציות ואזורי לחיצה גדולים, לפי ת"י 5568 ו-WCAG 2.0 AA. האפליקציה עובדת גם עם קורא מסך ומקלדת.'],["יש לי קורא ספרים אלקטרוני",'"מצב קורא אלקטרוני" בהגדרות: שחור-לבן, טקסט גדול, בלי אנימציות ותמונות כבדות. נשמר רק במכשיר שבו הופעל.'],["איך האפליקציה פונה אליי?",'בהגדרות ← "החשבון שלי" ← "איך לפנות אליך?": לשון נקבה, זכר או רבים. כל הטקסטים וההמלצות מתאימים את עצמם.']]},{id:"data",title:"הנתונים והפרטיות",icon:"Shield",intro:"רואים מה האפליקציה יודעת, מוחקים, מייצאים ומייבאים.",qa:[["מה האפליקציה יודעת עליי?",'בהגדרות ← "מה האפליקציה יודעת עליי": הפרופיל הספרותי, ההערה שלך, המשובים והספרים שנשללו. אפשר למחוק כל פריט.'],["איך מייצאים את הנתונים?",'בהגדרות ← "ייצוא וייבוא": קובץ CSV שמתאים ל-Goodreads ול-StoryGraph. ב"גיבוי ידני" יש גם גיבוי מלא (JSON)
