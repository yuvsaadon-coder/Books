    /* גופן אחד לכל האפליקציה (לבחירה בהגדרות), וגודל תצוגה (--zoom) */

    /* מצב קורא אלקטרוני: שחור-לבן בניגודיות מלאה, בלי אנימציות, צללים, שקיפויות ותמונות כבדות */

    .grid > *, main { min-width: 0; }
    html, body { overflow-x: hidden; }
    .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); }
    .safe-top { padding-top: env(safe-area-inset-top, 0px); }
    .clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

    .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    @keyframes sheetIn { from { transform: translateY(16px); opacity: .6; } to { transform: none; opacity: 1; } }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .fade-in, .sheet-in, .spin { animation: none; } }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .skip-link { position: absolute; inset-inline-start: 8px; top: -80px; z-index: 100; background: var(--surface); color: var(--ink); padding: 10px 14px; border-radius: 10px; border: 2px solid var(--accent); font-weight: 600; }
    .skip-link:focus { top: 8px; }
    input, textarea, select, button { font: inherit; color: inherit; }

    /* חלון ההמתנה לאימות: השלבים נדלקים אחד אחרי השני */
    .verify-dot { animation: verify-pulse 1.8s ease-in-out infinite; }
    .verify-line { background: linear-gradient(90deg, var(--line), var(--accent), var(--line)); background-size: 200% 100%; animation: verify-flow 1.8s linear infinite; }
    @keyframes verify-pulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 35%, transparent); } 50% { transform: scale(1.08); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 0%, transparent); } }
    @keyframes verify-flow { from { background-position: 200% 0; } to { background-position: 0 0; } }
    @media (prefers-reduced-motion: reduce) { .verify-dot, .verify-line { animation: none; } }

שפה ומקור":"Language and origin","לפי שפה ומקור":"By language and origin","קצב לאורך התקופה":"Pace over the period","ספרים לפי זמן":"Books over time",ועוד:"And also","ספרים התחילו ועדיין בקריאה":"books started and still in progress",'ספרים נוספו לרשימת "רוצה לקרוא"':'books added to "Want to read"',"ספרים הופסקו באמצע":"books stopped midway","שיתוף כתמונה":"Share as an image","ספרים חדשים שנבחרו בשבילך":"New books picked for you","צעדים ראשונים":"Getting started","מה שנקרא שומרת את הספרים שקראת, לומדת את הטעם שלך וממליצה על הספר הבא. כל ספר נבדק מול מאגרים אמיתיים, כך שאין ספרים מומצאים.":"What We Read keeps the books you've read, learns your taste and recommends your next book. Every book is checked against real catalogues, so there are no made-up books.","איך מתחילים?":"How do I start?",'בוחרים שם. בכניסה הראשונה בוחרים אילו סוגות להציג (למשל בלי ספרי ילדים), ואז נפתחת רשימה של ספרים מוכרים: החלקה ימינה = קראתי (ואז בוחרים דירוג), שמאלה = לא קראתי, והסימנייה = רוצה לקרוא. אפשר לדלג ולחזור אליה מהכרטיס שבראש "הספרים שלי".':`Choose a name. On first entry you pick which genres to show (for example, no children's books), and then a list of well-known books opens: swipe right = read (then choose a rating), left = not read, and the bookmark = want to read. You can skip it and come back from the card at the top of "My books".`,"איך מתקינים את האפליקציה על מסך הבית?":"How do I install the app on my home screen?",'באייפון: פותחים ב-Safari, לוחצים על כפתור השיתוף ובוחרים "הוספה למסך הבית". באנדרואיד: בכרום, בתפריט ⋮ בוחרים "התקנת האפליקציה", או לוחצים על ההודעה שמופיעה באפליקציה.':'On iPhone: open it in Safari, tap the share button and choose "Add to Home Screen". On Android: in Chrome, choose "Install app" from the ⋮ menu, or tap the prompt that appears in the app.',"איך חוזרים לרשימת הספרים המוכרים?":"How do I get back to the well-known books list?",'בהגדרות ← "המלצות" ← "רשימת 400 הספרים המוכרים": "המשך מאיפה שעצרתי" או "מההתחלה". יש גם קישור בתחתית לשונית "הוספת ספר". ספרים שכבר בספרייה לא מוצגים שוב.':`In Settings → "Recommendations" → "The list of 400 well-known books": "Continue where I stopped" or "From the start". There's also a link at the bottom of the "Add a book" tab. Books already in your library aren't shown again.`,"כמה משתמשים יכולים להשתמש בה?":"How many people can use it?","כל אחד במשפחה מקבל ספרייה, דירוגים והמלצות משלו. מחליפים משתמש בלחיצה על השם שבראש המסך.":"Everyone in the family gets their own library, ratings and recommendations. Switch users by tapping the name at the top of the screen.","הנתונים שלי נשמרים?":"Is my data saved?","הכול נשמר בטלפון ומסתנכרן אוטומטית, כך שהספרייה זמינה בכל מכשיר. הנקודה הירוקה ליד השם אומרת שהכול מסונכרן; כתומה = אין חיבור כרגע, והנתונים יסונכרנו כשיחזור.":"Everything is saved on the phone and syncs automatically, so your library is available on every device. The green dot next to the name means everything is synced; orange = no connection right now, and the data will sync when it's back.","הספרייה האישית: ארבעה מדפים, חיפוש, מיון, תגיות וסטטיסטיקות.":"Your personal library: four shelves, search, sorting, tags and statistics.","מה ההבדל בין המדפים?":"What's the difference between the shelves?",'"קראתי" – ספרים שסיימת, עם דירוג. "קורא עכשיו" – ספרים שבאמצע. "רוצה לקרוא" – רשימת המשאלות. "קראתי חלקית" – ספרים שהפסקת באמצע (הדירוג רשות, ועוזר להמלצות).':'"Read" – books you finished, with a rating. "Reading now" – books in progress. "Want to read" – your wishlist. "Partly read" – books you stopped midway (the rating is optional and helps recommendations).',"איך מסמנים שסיימתי ספר?":"How do I mark a book as finished?",'בספר שנמצא ב"קורא עכשיו" יש כפתור "סיימתי". בוחרים מתי (היום, אתמול או חודש) ומדרגים.':'A book in "Reading now" has a "Finished" button. Choose when (today, yesterday or a month) and rate it.',"איך עורכים או מוחקים ספר?":"How do I edit or delete a book?",'לוחצים על הספר, ובחלון שנפתח בוחרים "עריכה" או "מחיקה".':'Tap the book, and in the window that opens choose "Edit" or "Delete".',"אפשר לראות את הספרים כקוביות?":"Can I see the books as a grid?","כן. ליד החיפוש יש מתג בין רשימה לקוביות, ותפריט מיון (חדשים, מתי קראתי, שנת הוצאה, דירוג, א–ת).":"Yes. Next to the search there's a list/grid switch and a sort menu (newest, when I read it, year published, rating, A–Z).","איפה הסטטיסטיקות?":"Where are the statistics?",'בראש "הספרים שלי": מספר הספרים, הדירוג הממוצע, האהובים והשנה, ו"סטטיסטיקות לפי ז\'אנר" עם פירוט לפי סוגה, מדינה, שנה וסופר.':'At the top of "My books": number of books, average rating, favourites and this year, plus "Statistics by genre" broken down by genre, country, year and author.',"מאיפה יודעים מאיזו מדינה כל ספר?":"How do you know which country each book is from?","המדינה נקבעת לפי הסופר/ת, אוטומטית ברקע. המדינה מופיעה ליד הספר, בסטטיסטיקות ובסיכום, וההמלצות מתחשבות בה.":"The country is set by the author, automatically in the background. It appears next to the book, in the statistics and in the summary, and recommendations take it into account.","הוספת ספרים":"Adding books","שלוש דרכים להוסיף: ספר אחד, רשימה, או טקסט חופשי. רק ספרים שנמצאו במאגרים נכנסים לספרייה.":"Three ways to add: one book, a list, or free text. Only books found in the catalogues go into your library.","איך מוסיפים ספר אחד?":"How do I add one book?",'בלשונית "הוספת ספר" כותבים שם בעברית או באנגלית, ISBN או קישור לדף הספר. בוחרים את הספר (ואם רוצים, את המהדורה המדויקת), ואז את המדף והדירוג.':`On the "Add a book" tab, type a title in English or Hebrew, an ISBN or a link to the book's page. Choose the book (and, if you like, the exact edition), then the shelf and rating.`,"יש לי רשימה של הרבה ספרים":"I have a list of many books",'בוחרים "רשימה" ומדביקים ספר בכל שורה (אפשר להוסיף מחבר אחרי מקף). עוברים על הספרים אחד אחרי השני, ואפשר לדייק או לחפש מחדש.':'Choose "List" and paste one book per line (you can add the author after a dash). Go through the books one by one; you can refine or search again.',"אפשר פשוט לכתוב מה קראתי?":"Can I just write what I've read?",'כן. ב"טקסט חופשי" כותבים בחופשיות, ו-Claude מזהה את הספרים. אחר כך בוחרים ומדרגים כל אחד.':'Yes. In "Free text" write freely, and Claude identifies the books. Then choose and rate each one.',"מאיפה מגיעים התקציר והקישורים לחנויות?":"Where do the descriptions and store links come from?",'לכל ספר האפליקציה מחפשת את דף הספר אצל ההוצאה ובחנויות (עברית, סטימצקי, צומת ספרים ועוד), ומשם מביאה את התקציר המקורי וקישור ישיר. התקציר מועתק מהדף כמו שהוא, ונבדק שהוא באמת מופיע שם. הכול נשמר עם הספר ומתעדכן מעצמו; אם לא נמצא, יש כפתור "חיפוש מחדש".':`For each book the app looks for its page at the publisher and in stores, and brings the original description and a direct link from there. The description is copied from the page as is, and checked that it really appears there. Everything is saved with the book and updates itself; if nothing is found, there's a "Search again" button.`,"למה ספר לא נמצא?":"Why wasn't a book found?",'כל ספר נבדק מול Google Books, הספרייה הלאומית, Open Library והחנויות. אפשר לנסות את השם המלא, איות אחר, את השם בשפת המקור, ISBN מהכריכה האחורית, או "זיהוי חכם".':'Every book is checked against Google Books, the National Library of Israel, Open Library and the stores. Try the full title, a different spelling, the title in the original language, the ISBN from the back cover, or "Smart identification".',"אפשר לייבא מ-Goodreads או StoryGraph?":"Can I import from Goodreads or StoryGraph?",'כן: הגדרות ← "ייצוא וייבוא" ← "ייבוא מקובץ CSV". כל ספר נבדק, ומה שלא אומת מחכה ברשימה בלשונית ההוספה.':`Yes: Settings → "My data" → "Import from a CSV file". Every book is checked, and whatever couldn't be verified waits in the list on the Add tab.`,"Claude קורא את הפרופיל הספרותי שלך וממליץ, וכל המלצה נבדקת מול המאגרים והחנויות לפני שהיא מוצגת.":"Claude reads your literary profile and recommends, and every recommendation is checked against the catalogues and stores before it's shown.","איך מקבלים המלצה?":"How do I get a recommendation?",'בלשונית "גלה ספר חדש" כותבים מה בא לך, בוחרים מיקוד (מצב רוח, ז\'אנר, תקופה ועוד) ולוחצים "המלצה חכמה". Claude ישאל 2–4 שאלות קצרות לדיוק (אפשר לדלג או להחליף שאלה).':'On the "Discover" tab, write what you feel like, pick a focus (mood, genre, period and more) and tap "Smart recommendation". Claude will ask 2–4 short questions to narrow it down (you can skip or swap a question).',"כמה זמן זה לוקח?":"How long does it take?","בדרך כלל דקה-שתיים. אפשר לצאת מהאפליקציה: ההמלצה ממשיכה בשרת, ואפשר לקבל התראה כשהיא מוכנה.":"Usually a minute or two. You can leave the app: the recommendation continues on the server, and you can get a notification when it's ready.","למה אפשר לסמוך על ההמלצות?":"Why can I trust the recommendations?","כל ספר שהמודל מציע נבדק מול הספרייה הלאומית, Google Books והחנויות; ספר שלא נמצא נפסל. בכל המלצה מופיעים זמינות (מודפס, דיגיטלי, קולי), קישורים לרכישה וביקורות מאתרים מוכרים.":"Every book the model suggests is checked against the National Library of Israel, Google Books and the stores; a book that isn't found is dropped. Each recommendation shows availability (print, e-book, audio), purchase links and reviews from well-known sites.","ההמלצות לא מתאימות לי":"The recommendations don't suit me",'כותבים בתיבה "לא בדיוק זה?" מה לא מתאים, ומקבלים הצעות מעודכנות. על ספר מסוים לוחצים "לא בשבילי" ובוחרים לחודש או לתמיד, עם הערה שמדייקת את הפרופיל.':`Write in the "Not quite it?" box what doesn't fit, and you'll get updated suggestions. On a specific book, tap "Not for me" and choose a month or forever, with a note that refines your profile.`,"איפה כל ההמלצות שקיבלתי?":"Where are all the recommendations I've received?",'בלשונית "גלה ספר חדש" ← "כל ההמלצות": כל ההמלצות מהשיחות ומההצעות הדו-שבועיות. מסמנים "טובה" או "לא טובה", ואפשר להוסיף למה (רשות). הטובות מופיעות למעלה, אלה שלא התאימו מוצנעות בסוף הרשימה, והסימונים מלמדים את ההמלצות הבאות ואת הפרופיל הספרותי.':`On the "Discover" tab → "All recommendations": every recommendation from your chats and the two-week suggestions. Mark "Good" or "Not good", and add why if you like. Good ones show at the top, the ones that didn't fit are tucked away at the end, and your marks teach the next recommendations and your literary profile.`,"באיזו שפה הספרים?":"What language are the books in?",'בשאלון מסמנים עברית, אנגלית ו/או שפות זרות. ברירת המחדל: עברית ואנגלית. משנים אותה בהגדרות ← "המלצות" ← "שפות ברירת המחדל להמלצות".':'In the questionnaire, tick English, Hebrew and/or other languages. The default is English. Change it in Settings → "Recommendations" → "Default languages for recommendations".','מה זה "ספר בשביל מישהו אחר"?':'What is "For someone else"?','מצב מתנה: מתארים את מי שמקבל את הספר, וההמלצה לא נשענת על הטעם שלך ולא משנה אותו. ספר שנשמר נכנס ל"רוצה לקרוא" עם התגית "מתנה".':`Gift mode: describe the person receiving the book, and the recommendation doesn't rely on your taste or change it. A saved book goes into "Want to read" with the tag "Gift".`,"מה זה הפרופיל הספרותי?":"What is the literary profile?",'תקציר של הטעם שלך, שנבנה מהספרים, מהדירוגים ומההערות, ומתעדכן לבד. הוא לוקח בחשבון מתי קראת כל ספר, כדי לזהות לאן הטעם מתפתח. בראש "גלה ספר חדש" הוא מקופל; לוחצים עליו כדי לקרוא, לעדכן או להוסיף הערה משלך.':`A summary of your taste, built from your books, ratings and notes, that updates itself. It takes into account when you read each book, to see where your taste is heading. At the top of "Discover" it's collapsed; tap it to read it, update it or add your own note.`,"מה ההצעות הדו-שבועיות?":"What are the two-week suggestions?","כל שבועיים נבחרים 10 ספרים חדשים לפי מה שקראת, בלי ספרים שכבר הוצעו או שקראת. הם מופיעים בראש המסך, ואפשר לקבל התראה.":"Every two weeks, 10 new books are picked based on what you've read, without books already suggested or read. They show at the top of the screen, and you can get a notification.","דוח על הקריאה שלך: כמה, מה, מתי ואיך, לשבועיים, לחודש, לשנה או לכל הזמן.":"A report on your reading: how much, what, when and how, for two weeks, a month, a year or all time.","איפה הסיכום?":"Where's the summary?",'כשיש סיכום חדש מופיע כרטיס בראש "הספרים שלי". אחרי שצפית בו, הוא עובר לקישור "סיכום הקריאה" ליד הסטטיסטיקות.':`When there's a new summary, a card appears at the top of "My books". After you've viewed it, it moves to a "Reading summary" link next to the statistics.`,"מה יש בו?":"What's in it?","ספרים ועמודים (בהשוואה לתקופה הקודמת), דירוג ממוצע וקצב, סוג הקריאה, הספר של התקופה, סוגות, עשורי כתיבה, סופרים, התפלגות דירוגים, אורך, שפה ומקור, וקצב לאורך התקופה.":"Books and pages (compared with the previous period), average rating and pace, your reading type, the book of the period, genres, decades written, authors, rating distribution, length, language and origin, and pace over the period.","למה חלק מהספרים לא נספרים?":"Why aren't some books counted?","הסיכום סופר רק ספרים עם תאריך סיום. ספרים שסומנו מרשימת המוכרים אין להם תאריך; אפשר לערוך ספר ולבחור מתי קראת אותו.":"The summary counts only books with a finish date. Books marked from the well-known list have no date; you can edit a book and choose when you read it.","אפשר לשתף?":"Can I share it?",'כן: "שיתוף כתמונה" בסוף הסיכום יוצר תמונה לשיתוף או לשמירה.':'Yes: "Share as an image" at the end of the summary creates an image to share or save.',"רואים מה החברים קוראים ואוהבים, ממליצים אחד לשני ומגלים ספרים דרכם.":"See what friends are reading and loving, recommend to each other and discover books through them.","איך מוסיפים חבר?":"How do I add a friend?",'בלשונית "חברים" ← "להוסיף חברים" ← "בקשת חברות". אחרי שהחבר מאשר, רואים את המדפים שלו.':'On the "Friends" tab → "Add friends" → "Friend request". Once they accept, you can see their shelves.',"מה החברים רואים עליי?":"What do friends see about me?",'בוחרים בהגדרות ← "פרטיות וחברים": ספרים שקראת ודירוגים, רשימת "רוצה לקרוא", הערות, והופעה בלי שם ב"אהובים בקהילה".':`You choose in Settings → "Privacy and friends": books you've read and ratings, your "Want to read" list, notes, and appearing anonymously in "Community favourites".`,"איך ממליצים לחבר?":"How do I recommend to a friend?",'במדף של חבר או בספר שלך לוחצים "להמליץ", בוחרים חבר (או כל החברים) ומוסיפים משפט.':`On a friend's shelf or on your own book, tap "Recommend", choose a friend (or all friends) and add a sentence.`,"התראה כשההמלצה מוכנה, וכשמגיעים הסיכום וההצעות הדו-שבועיות.":"A notification when a recommendation is ready, and when the summary and two-week suggestions arrive.","איך מפעילים התראות?":"How do I turn on notifications?",'בהגדרות ← "התראות" ← "התראה כשיש הצעות חדשות", ומאשרים בחלון של הטלפון. אפשר גם מהשורה שמופיעה בזמן שההמלצה מתגבשת.':`In Settings → "Notifications" → "Notify me about new suggestions", and allow it in the phone's prompt. You can also do it from the line that appears while a recommendation is being prepared.`,"באייפון לא מגיעות התראות":"Notifications don't arrive on iPhone","באייפון התראות עובדות רק אחרי התקנה על מסך הבית (iOS 16.4 ומעלה), ורק כשפותחים את האפליקציה משם.":"On iPhone, notifications work only after installing to the home screen (iOS 16.4 or later), and only when you open the app from there.","אפשר להתאים את המראה, הגופן והגודל, ולהפעיל מצב נגישות.":"You can adjust the look, font and size, and turn on accessibility mode.","איך משנים צבעים?":"How do I change the colors?",'בהגדרות ← "תצוגה ונגישות": שש ערכות (נייר וקלף, ספרייה ישנה, דיו כחול, אבן ירושלמית, שזיף ולבנדר, ים תיכון) או "מתחלף כל יום", ובחירה בין בהיר, כהה או לפי המכשיר.':'In Settings → "Display and accessibility": six themes (Paper and parchment, Old library, Blue ink, Jerusalem stone, Plum and lavender, Mediterranean) or "Changes every day", and a choice of light, dark or match device.',"איך מגדילים את הטקסט?":"How do I make the text bigger?",'בהגדרות ← "תצוגה ונגישות" ← "גודל הטקסט": א+ להגדלה וא- להקטנה, מ-90% עד 150%. אפשר גם לבחור גופן: פרנק רוהל, דוד, אסיסטנט או אלף.':'In Settings → "Display and accessibility" → "Text size": A+ to enlarge and A− to shrink, from 90% to 150%. You can also choose a font: Frank Ruhl, David, Assistant or Alef.',"מה עושה מצב נגישות?":"What does accessibility mode do?",'ניגודיות גבוהה, טקסט גדול יותר, קישורים עם קו תחתון, מסגרת מיקוד בולטת, בלי אנימציות ואזורי לחיצה גדולים, לפי ת"י 5568 ו-WCAG 2.0 AA. האפליקציה עובדת גם עם קורא מסך ומקלדת.':"High contrast, larger text, underlined links, a clear focus outline, no animations and larger tap areas, per IS 5568 and WCAG 2.0 AA. The app also works with a screen reader and keyboard.","יש לי קורא ספרים אלקטרוני":"I have an e-reader",'"מצב קורא אלקטרוני" בהגדרות ← "תצוגה ונגישות": שחור-לבן, טקסט גדול, בלי אנימציות ותמונות כבדות. נשמר רק במכשיר שבו הופעל.':`"E-reader mode" in Settings → "Display and accessibility": black and white, large text, no animations or heavy images. It's saved only on the device where you turned it on.`,"איך מתמצאים בהגדרות?":"How are the settings organized?","ההגדרות מחולקות לקבוצות: החשבון שלי, המלצות, התראות, תצוגה ונגישות, משוב, פרטיות וחברים, הנתונים שלי. כל קבוצה מקופלת ונפתחת בלחיצה, והאפליקציה זוכרת אילו קבוצות פתחת.":"Settings are split into groups: My account, Recommendations, Notifications, Display and accessibility, Feedback, Privacy and friends, My data. Each group is collapsed and opens with a tap, and the app remembers which groups you opened.","איך עוברים לאנגלית?":"How do I change the language?",'בהגדרות ← "החשבון שלי" ← "שפה · Language" בוחרים English (או עברית). אפשר לבחור גם במסך הכניסה. האפליקציה נטענת מחדש בשפה שנבחרה, וההמלצות וההצעות הדו-שבועיות נכתבות בה.':'In Settings → "My account" → "שפה · Language", choose English or עברית (Hebrew). You can also choose on the sign-in screen. The app reloads in the chosen language, and recommendations and two-week suggestions are written in it.',"איך האפליקציה פונה אליי?":"How does the app address me?",'בהגדרות ← "החשבון שלי" ← "איך לפנות אליך?": לשון נקבה, זכר או רבים. כל הטקסטים וההמלצות מתאימים את עצמם.':'In Hebrew, you can choose feminine, masculine or plural address in Settings → "My account".',"הנתונים והפרטיות":"Data and privacy","רואים מה האפליקציה יודעת, מוחקים, מייצאים ומייבאים.":"See what the app knows, delete, export and import.","מה האפליקציה יודעת עליי?":"What does the app know about me?",'בהגדרות ← "הנתונים שלי" ← "מה האפליקציה יודעת עליי": הפרופיל הספרותי, ההערה שלך, המשובים והספרים שנשללו. אפשר למחוק כל פריט.':'In Settings → "My data" → "What the app knows about me": your literary profile, your note, feedback and rejected books. You can delete any item.',"איך מייצאים את הנתונים?":"How do I export my data?",'בהגדרות ← "הנתונים שלי": קובץ CSV שמתאים ל-Goodreads ול-StoryGraph. ב"גיבוי ידני" יש גם גיבוי מלא (JSON) ורשימה כטקסט.':'In Settings → "My data": a CSV file that works with Goodreads and StoryGraph. "Manual backup" also has a full backup (JSON) and a list as text.',"משהו לא עובד":"Something isn't working",'בהגדרות ← "משוב" כותבים מה קרה, וזה מגיע ישר ליובל.':'In Settings → "Feedback", write what happened; it goes straight to Yuval.',"מדריך למשתמש":"User guide","סגירת המדריך":"Close the guide","חיפוש במדריך":"Search the guide","חיפוש: למשל התראות, ייבוא, גודל טקסט":"Search: e.g. notifications, import, text size",נושאים:"Topics","לא נמצאה תשובה. אפשר לכתוב לנו בתיבת המשוב שבהגדרות.":"No answer found. You can write to us in the feedback box in Settings.","ספרים חדשים בשבילך":"New books for you","לפי הספרים שקראת וההעדפות שלך":"Based on the books you've read and your preferences","ההצעות של {0}":"Suggestions for {0}","לא נציע אותו שוב.":"We won't suggest it again.","השינויים נשמרו":"Changes saved",'"{0}" נוסף לרשימת "רוצה לקרוא"':'"{0}" added to "Want to read"','"{0}" נוסף ל"{1}". קריאה נעימה!':'"{0}" added to "{1}". Enjoy!','"{0}" נשמר בספרייה':'"{0}" saved to your library',"החלפת משתמש":"Switch user","היכרות עם הטעם שלך":"Getting to know your taste","הספר נמחק":"Book deleted","ניווט ראשי":"Main navigation","{0} חדשים":"{0} new",מסונכרן:"Synced","מסתנכרן…":"Syncing…","אין חיבור, נשמר בטלפון":"Offline, saved on the phone","מה קראת, מה תקרא, ומה החברים אוהבים":"What you've read, what you'll read, and what friends love","של מי הספרייה?":"Whose library is this?","במכשיר כבר יש ספרייה עם":"This device already has a library with","ספרים. היא תשויך למשתמש הראשון שתיצרו.":"books. It will belong to the first user you create.","משתמש חדש":"New user","איך לקרוא לך?":"What should we call you?","שם או כינוי":"Name or nickname","כבר יש משתמש בשם הזה.":"There's already a user with that name.",כניסה:"Enter","הוספת משתמש":"Add a user","קלאסיקות עולמיות":"World classics","ספרות עכשווית מתורגמת":"Contemporary fiction","מתח ובלש":"Thrillers and mysteries",פנטזיה:"Fantasy","מדע בדיוני ודיסטופיה":"Science fiction and dystopia","רומנטיקה ורגש":"Romance","רומן היסטורי":"Historical fiction","שואה וזיכרון":"Holocaust and memory","עיון ומדע פופולרי":"Nonfiction and popular science","ביוגרפיה וזיכרונות":"Biography and memoir","פסיכולוגיה והתפתחות אישית":"Psychology and self-development","ילדים ונוער":"Children and young adult",הומור:"Humor","קליל ומחמם לב":"Light and heartwarming","ספרות מופת":"Classics","ספרות עכשווית":"Contemporary fiction",מתח:"Thriller",'מד"ב':"Sci-fi",היסטורי:"Historical",שואה:"Holocaust",עיון:"Nonfiction",ביוגרפיה:"Biography",פסיכולוגיה:"Psychology",נוער:"Young adult",קליל:"Light reading","קצב איטי":"Slow pace","קצב מהיר":"Fast pace",מרגש:"Moving","מעורר מחשבה":"Thought-provoking",בלש:"Detective",מותחן:"Thriller","מדע בדיוני":"Science fiction",אימה:"Horror",קלאסיקה:"Classic",מדע:"Science",היסטוריה:"History",דיסטופיה:"Dystopia",פילוסופיה:"Philosophy",מתנה:"Gift","לא מסווג":"Unclassified","ארצות הברית":"United States",בריטניה:"United Kingdom",אנגליה:"England",סקוטלנד:"Scotland",אירלנד:"Ireland",קנדה:"Canada",אוסטרליה:"Australia","ניו זילנד":"New Zealand",צרפת:"France",גרמניה:"Germany",אוסטריה:"Austria",שווייץ:"Switzerland",איטליה:"Italy",ספרד:"Spain",פורטוגל:"Portugal",הולנד:"Netherlands",בלגיה:"Belgium",שוודיה:"Sweden",נורווגיה:"Norway",דנמרק:"Denmark",פינלנד:"Finland",איסלנד:"Iceland",פולין:"Poland","צ'כיה":"Czech Republic",הונגריה:"Hungary",רומניה:"Romania",יוון:"Greece",טורקיה:"Turkey",רוסיה:"Russia","ברית המועצות":"Soviet Union",אוקראינה:"Ukraine",יפן:"Japan",סין:"China","קוריאה הדרומית":"South Korea","דרום קוריאה":"South Korea",הודו:"India",פקיסטן:"Pakistan",אפגניסטן:"Afghanistan",איראן:"Iran",מצרים:"Egypt",לבנון:"Lebanon",ניגריה:"Nigeria","דרום אפריקה":"South Africa",קניה:"Kenya",מקסיקו:"Mexico",ארגנטינה:"Argentina",ברזיל:"Brazil","צ'ילה":"Chile",קולומביה:"Colombia",פרו:"Peru",קובה:"Cuba",אלבניה:"Albania",סרביה:"Serbia",קרואטיה:"Croatia",בוסניה:"Bosnia",ליטא:"Lithuania",לטביה:"Latvia",אסטוניה:"Estonia",בלארוס:"Belarus",גאורגיה:"Georgia",ארמניה:"Armenia",וייטנאם:"Vietnam",תאילנד:"Thailand",אינדונזיה:"Indonesia",הפיליפינים:"Philippines",טייוואן:"Taiwan","סרי לנקה":"Sri Lanka",בנגלדש:"Bangladesh",עיראק:"Iraq",סוריה:"Syria",פלסטין:"Palestine",מרוקו:"Morocco","אלג'יריה":"Algeria",תוניסיה:"Tunisia",אתיופיה:"Ethiopia",זימבבואה:"Zimbabwe",גאנה:"Ghana","טרינידד וטובגו":"Trinidad and Tobago","ג'מייקה":"Jamaica",אורוגוואי:"Uruguay",ונצואלה:"Venezuela",גואטמלה:"Guatemala","מקור חיצוני":"External source","לתקציר הקצר":"Shorter description","בודקים כל ספר במאגרים":"Checking each book in the catalogues","מוודאים שזה הספר הנכון":"Making sure it's the right book","הספר נכנס לספרייה":"The book goes into your library","נא להמתין כמה שניות עד שהבדיקה תסתיים.":"Please wait a few seconds until the check finishes.","כדאי להשאיר את המסך פתוח. ספרים שכבר נבדקו נשמרים מיד, ואם יוצאים באמצע, הבדיקה ממשיכה בפתיחה הבאה.":"Keep the screen open. Books already checked are saved right away, and if you leave midway, the check continues next time you open the app.","הסתרה מחברים":"Hide from friends","הספר מוסתר מחברים":"The book is hidden from friends","הספר גלוי שוב לחברים":"Friends can see the book again","מוסתר מחברים":"Hidden from friends","איך מסתירים ספר מסוים מחברים?":"How do I hide a specific book from friends?",'לוחצים על הספר ב"הספרים שלי" ומפעילים "הסתרה מחברים". הספר נשאר אצלך, אבל לא מופיע במדף שלך אצל החברים, בהמלצות שלהם וב"אהובים בקהילה". ליד ספר מוסתר מופיע סימן של עין מחוקה.':`Tap the book in "My books" and turn on "Hide from friends". The book stays in your library, but it doesn't appear on your shelf for friends, in their recommendations or in "Community favourites". A hidden book shows a crossed-out eye.`,סיסמה:"Password","עברו {0} שנים מאז שקראת את הספר. האם לקחת אותו בחשבון בגיבוש ההמלצות?":"It's been {0} years since you read this book. Should it count toward your recommendations?","להתחשב בספר בהמלצות?":"Count this book in recommendations?",כן:"Yes",לא:"No","להתחשב בספר בהמלצות":"Count this book in recommendations","ההמלצות יתחשבו בספר":"Recommendations will take this book into account","ההמלצות לא יתחשבו בספר":"Recommendations will ignore this book","לא נלקח בחשבון בהמלצות":"Not counted in recommendations","איך ההמלצות מתחשבות במתי קראתי?":"How do recommendations take into account when I read a book?","לכל ספר יש משקל: כמה אהבת אותו, כפול כמה הוא עדכני. ספר מאתמול שווה פי שניים מספר מלפני 3 שנים, ופי 8 בערך מספר מלפני 10 שנים. למודל נשלחים רק הספרים שהכי מעידים על הטעם שלך היום, וכך ההמלצה מדויקת וזולה יותר.":"Every book has a weight: how much you liked it, times how recent it is. A book from yesterday counts twice as much as one from 3 years ago, and about 8 times as much as one from 10 years ago. Only the books that best show your taste today are sent to the model, which makes recommendations more accurate and cheaper.","אפשר שההמלצות לא יתחשבו בספר מסוים?":"Can recommendations ignore a specific book?",'כן. לוחצים על הספר ומכבים "להתחשב בספר בהמלצות". הספר נשאר בספרייה ולא יומלץ שוב, אבל לא משפיע על הטעם. כשמסמנים ספר שנקרא לפני 5 שנים ויותר, האפליקציה שואלת על כך בעצמה.':`Yes. Tap the book and turn off "Count this book in recommendations". The book stays in your library and won't be recommended again, but it doesn't affect your taste. When you mark a book read 5 or more years ago, the app asks about it.`,"נוספו {0} ספרים מהסדרה":"{0} books from the series added",סדרה:"Series","ספר {0} מתוך {1} בסדרה":"Book {0} of {1} in the series","סימון כל הסדרה":"Mark the whole series","לאיזה מדף":"Which shelf","דירוג לכל הספרים":"Rating for all the books","{0} מתוך {1} · נוספו {2}":"{0} of {1} · {2} added","מקור: Wikidata":"Source: Wikidata","אפשר לסמן סדרה שלמה?":"Can I mark a whole series?",'כן. כשספר הוא חלק מסדרה, מופיע בחלון שלו (וגם בתוצאות החיפוש) "ספר X מתוך Y בסדרה". לוחצים "סימון כל הסדרה", בוחרים אילו ספרים, מדף ודירוג, וכל ספר נבדק במאגרים לפני שהוא נכנס. המידע על הסדרות מגיע מ-Wikidata, ומוצג רק כשהוא חד-משמעי: אותו מחבר, ומספר לכל ספר בסדרה.':`Yes. When a book is part of a series, its window (and the search results) show "Book X of Y in the series". Tap "Mark the whole series", choose which books, a shelf and a rating, and each book is checked in the catalogues before it goes in. Series information comes from Wikidata and is shown only when it's unambiguous: the same author, and a number for every book in the series.`,"אילו סוגות להציג?":"Which genres should we show?","בטלו סוגות שלא מעניינות אתכם, והספרים מהן לא יוצגו.":"Turn off genres you're not interested in, and their books won't be shown.","סוגות להצגה":"Genres to show",הכול:"All",כלום:"None","התחלה ({0} סוגות)":"Start ({0} genres)",'ימינה: קראתי. שמאלה: לא קראתי. אחרי "קראתי" בוחרים דירוג.':'Right: read. Left: not read. After "Read", choose a rating.',"סוגות ({0})":"Genres ({0})","דרגו כדי להמשיך":"Rate it to continue","ספרים בלי דירוג":"Books without a rating",'לפני ההוספה, דרגו את הספרים שסימנתם "קראתי":':'Before adding, rate the books you marked "Read":',"במקור:":"Original:","📚 מתוך הספרים שלי":"📚 From my books",'אין ספרים ברשימת "רוצה לקרוא". הוסיפו ספרים לרשימה, או בחרו "מכל הספרים".':'There are no books on your "Want to read" list. Add some, or choose "From all books".',"Claude בוחר מתוך {0} ספרים שברשימה שלך…":"Claude is choosing from the {0} books on your list…","מכל הספרים":"From all books","מהספרים שלי":"From my books","🎁 מתנה":"🎁 Gift",'הבחירה רק מתוך {0} הספרים שברשימת "רוצה לקרוא" שלך.':'Chosen only from the {0} books on your "Want to read" list.',"אפשר לקבל המלצה רק מתוך הספרים שלי?":"Can I get a recommendation only from my own books?",'כן. ב"גלה ספר חדש" בוחרים "מהספרים שלי": Claude בוחר את הספר הבא מתוך רשימת "רוצה לקרוא" (וספרים שהתחלת והפסקת), לפי הבקשה והטעם שלך, בלי לחפש ספרים חדשים.':'Yes. In "Discover", choose "From my books": Claude picks your next book from your "Want to read" list (and books you started and stopped), based on your request and taste, without looking for new books.',"מחיקת המשתמש":"Delete this user","ניהול משתמשים":"Manage users","יותר מדי ניסיונות. נסו שוב בעוד רבע שעה.":"Too many attempts. Try again in 15 minutes.","צריך שם או כינוי.":"A name or nickname is required.","אין חיבור לשרת. נסו שוב.":"Can't reach the server. Try again.","ניסיון נוסף":"Try again",טוען:"Loading","ברוכים הבאים!":"Welcome!","כבר יש לכם ספרייה כאן? בחרו אותה:":"Already have a library here? Choose it:","בלי סיסמה":"No password","אין חיבור לשרת, ושינויים אחרונים עוד לא נשמרו בו. לצאת בכל זאת?":"Can't reach the server, and recent changes aren't saved there yet. Sign out anyway?","איך נכנסים?":"How do I sign in?","הספרייה שלי מוגנת?":"Is my library protected?","מידע משפטי ונגישות":"Legal and accessibility","פרטיות, תנאי שימוש, הצהרת נגישות":"Privacy, terms of use, accessibility statement","מדיניות פרטיות":"Privacy policy","תנאי שימוש":"Terms of use","איפה מדיניות הפרטיות, תנאי השימוש והצהרת הנגישות?":"Where are the privacy policy, terms of use and accessibility statement?",'בהגדרות ← "מידע משפטי ונגישות", וגם בתחתית מסך הכניסה. שם כתוב מה נשמר, איפה, מי רואה את המידע, ואיך מעיינים בו, מתקנים או מוחקים אותו.':'In Settings → "Legal and accessibility", and at the bottom of the sign-in screen. They explain what is stored, where, who sees it, and how to view, correct or delete it.',"דילוג לתוכן הראשי":"Skip to main content","צריך לאשר את תנאי השימוש ואת מדיניות הפרטיות.":"You need to accept the terms of use and the privacy policy.",'מפעיל האפליקציה "מה שנקרא"':'the operator of the "Ma SheNikra" app','דרך "משוב" בהגדרות, או במייל {0}':'through "Feedback" in Settings, or by email at {0}','דרך "משוב" בהגדרות':'through "Feedback" in Settings',כללי:"General",'המדיניות מסבירה איזה מידע נאסף באפליקציה "מה שנקרא", למה, איפה הוא נשמר ומה הזכויות שלכם, לפי חוק הגנת הפרטיות, התשמ"א-1981, ותקנותיו. האחראי על המידע: {0}. פניות: {1}.':"This policy explains what information the app collects, why, where it is stored and what your rights are, under Israel's Protection of Privacy Law, 5741-1981, and its regulations. Responsible for the data: {0}. Contact: {1}.","איזה מידע נאסף":"What we collect",'הספרייה שלכם: ספרים, דירוגים, הערות, תגיות, מתי קראתם, "רוצה לקרוא", ספרים שדחיתם, בקשות המלצה, היסטוריית ההמלצות, הפרופיל הספרותי שנבנה מהם וההגדרות.':'Your library: books, ratings, notes, tags, when you read them, "Want to read", books you turned down, recommendation requests, recommendation history, the reader profile built from them, and your settings.',"חברים: בקשות חברות, והמלצות ששלחתם או קיבלתם.":"Friends: friend requests, and recommendations you sent or received.","משוב ששלחתם (עם השם שלכם). אם הפעלתם התראות: כתובת ההרשמה של הדפדפן להתראות.":"Feedback you sent (with your name). If you turned on notifications: your browser's push subscription address.","מידע טכני: כתובת ה-IP נשמרת עד רבע שעה, רק כדי להגביל ניסיונות כניסה. אין כלי מעקב, אין פרסומות, אין עוגיות ואין ניתוח התנהגות.":"Technical data: your IP address is kept for up to 15 minutes, only to limit sign-in attempts. No trackers, no ads, no cookies and no behavioural analytics.",'במכשיר עצמו נשמרים הספרייה, ההגדרות ואסימון הכניסה, כדי שהאפליקציה תעבוד גם בלי רשת. "החלפת משתמש" מוחקת אותם מהמכשיר.':'Your library, settings and sign-in token are stored on the device so the app works offline. "Switch user" removes them from the device.',"האם חובה למסור את המידע?":"Do you have to provide this information?","אין חובה חוקית. המסירה היא מרצונכם ובהסכמתכם, אבל בלי חשבון אי אפשר להשתמש באפליקציה, ובלי ספרים אי אפשר לקבל המלצות. ההערות על ספרים הן רשות: מה שתכתבו בהן, כולל דעות, נשמר כמו שהוא – כתבו רק מה שנוח לכם.":"There is no legal obligation. You provide it voluntarily and with your consent, but without an account you can't use the app, and without books you can't get recommendations. Notes on books are optional: whatever you write, including opinions, is stored as is – write only what you are comfortable with.","למה משתמשים במידע":"How we use it","כדי לשמור ולסנכרן את הספרייה בין המכשירים שלכם; כדי ללמוד את הטעם שלכם ולהמליץ על ספרים, כולל ההצעות הדו-שבועיות; כדי להציג לחברים את מה שבחרתם לשתף; כדי לשפר את האפליקציה לפי משוב; וכדי לאבטח את החשבון. המידע לא נמכר, לא משמש לפרסום ולא נמסר לאף אחד לשום מטרה אחרת.":"To store and sync your library across your devices; to learn your taste and recommend books, including the biweekly suggestions; to show friends what you chose to share; to improve the app based on feedback; and to secure your account. Your data is not sold, not used for advertising and not given to anyone for any other purpose.","מי רואה את המידע":"Who sees your information",'חברים שאישרתם: רק מה שבחרתם בהגדרות ← "פרטיות וחברים", בלי ספרים שסימנתם "הסתרה מחברים".':'Friends you accepted: only what you chose in Settings → "Privacy and friends", without books you marked "Hide from friends".','שאר המשתמשים: רק השם והצבע שלכם, כדי שאפשר יהיה לשלוח לכם בקשת חברות. "אהובים בקהילה" הוא סיכום אנונימי של ספרים ששני משתמשים לפחות דירגו 4 ומעלה, בלי שמות ובלי הערות; אפשר לצאת ממנו בהגדרות.':'Other users: only your name and colour, so they can send you a friend request. "Community favourites" is an anonymous summary of books that at least two users rated 4 or higher, without names or notes; you can opt out in Settings.','ספקי שירות והעברת מידע לחו"ל':"Service providers and transfers abroad","המידע נשמר ומעובד אצל ספקי שירות ששרתיהם מחוץ לישראל, בעיקר בארצות הברית ובאירופה:":"Your data is stored and processed by service providers whose servers are outside Israel, mainly in the United States and Europe:","Cloudflare – השרת ומסד הנתונים.":"Cloudflare – the server and database.","GitHub – אחסון קובצי האפליקציה, בלי מידע אישי.":"GitHub – hosting the app files, with no personal data.","הספרייה הלאומית, Open Library, Wikidata ואתרי חנויות והוצאות – נשלחים רק שם הספר והסופר, בלי שום פרט מזהה.":"The National Library of Israel, Open Library, Wikidata and bookstore and publisher sites – only the book title and author are sent, with no identifying details.",'ההסכמה למדיניות כוללת הסכמה להעברת המידע לספקים האלה, לפי תקנות הגנת הפרטיות (העברת מידע אל מאגרי מידע שמחוץ לגבולות המדינה), התשס"א-2001. הספקים מחויבים בתנאים שלהם לשמור על המידע ולא להשתמש בו למטרות אחרות.':"Agreeing to this policy includes consent to transferring data to these providers, under the Protection of Privacy (Transfer of Data to Databases Abroad) Regulations, 5761-2001. The providers are bound by their terms to protect the data and not use it for other purposes.","כמה זמן המידע נשמר":"How long we keep it",'כל עוד החשבון קיים. מחיקת המשתמש (הגדרות ← "החשבון שלי") מוחקת את הספרייה, פרטי הכניסה, ההתראות וההצעות, ומנתקת את כל המכשירים. עותקי הגיבוי של השרת נמחקים לבד תוך 30 יום. מטמון של פרטי ספרים, שאינו מידע אישי, נשמר עד 14 יום.':'As long as your account exists. Deleting the user (Settings → "My account") deletes the library, sign-in details, notifications and suggestions, and signs out every device. Server backups are deleted automatically within 30 days. A cache of book details, which is not personal data, is kept for up to 14 days.',"הזכויות שלכם":"Your rights",'עיון במידע (סעיף 13 לחוק): הגדרות ← "הנתונים שלי" ← "מה האפליקציה יודעת עליי", וייצוא מלא של הספרייה.':'Access (section 13 of the law): Settings → "My data" → "What the app knows about me", and a full export of your library.',"תיקון ומחיקה (סעיף 14 לחוק): אפשר לערוך או למחוק כל ספר, הערה או פריט, או למחוק את המשתמש כולו.":"Correction and deletion (section 14 of the law): you can edit or delete any book, note or item, or delete the whole user.","לכל בקשה אחרת, או אם משהו לא נענה: {0}. אפשר גם לפנות לרשות להגנת הפרטיות.":"For any other request, or if something wasn't handled: {0}. You may also contact the Israeli Privacy Protection Authority.","אבטחת מידע":"Security",קטינים:"Minors","האפליקציה מיועדת לגיל 16 ומעלה. מתחת לגיל 16 – רק בהסכמת הורה.":"The app is intended for ages 16 and up. Under 16 – only with a parent's consent.","שינויים במדיניות":"Changes to this policy","שינוי מהותי במדיניות יוצג באפליקציה, והיא תבקש את הסכמתכם מחדש.":"Any material change will be shown in the app, and it will ask for your consent again.",השירות:"The service",'"מה שנקרא" היא אפליקציה חינמית לשימוש אישי: ניהול ספרים שקראתם וקבלת המלצות. השימוש בה מותנה בתנאים האלה ובמדיניות הפרטיות.':`"Ma SheNikra" is a free app for personal use: keeping track of books you've read and getting recommendations. Using it is subject to these terms and the privacy policy.`,"גיל וחשבון":"Age and account","המלצות ותוכן שנוצר בבינה מלאכותית":"Recommendations and AI-generated content","ההמלצות, הפרופיל הספרותי, סיכומי הביקורות והתרגומים נוצרים אוטומטית בעזרת בינה מלאכותית (Claude של Anthropic). האפליקציה בודקת שכל ספר מומלץ קיים במאגרים אמיתיים, אבל התוכן עלול לכלול טעויות. זו המלצה בלבד, ולא ייעוץ מכל סוג.":"Recommendations, the reader profile, review summaries and translations are generated automatically by AI (Anthropic's Claude). The app checks that every recommended book exists in real catalogues, but the content may contain mistakes. It is a suggestion only, not advice of any kind.","מידע מצדדים שלישיים":"Third-party information","פרטי ספרים, כריכות, תקצירים, זמינות וקישורים מגיעים מ-Google Books, הספרייה הלאומית, Open Library, Wikidata ואתרי חנויות והוצאות, ומוצגים עם ציון המקור. לא מובטח שהם מדויקים או עדכניים. קנייה באתר חיצוני היא בינכם לבין האתר. לאפליקציה אין קשר מסחרי לחנויות, והיא לא מקבלת עמלות.":"Book details, covers, synopses, availability and links come from Google Books, the National Library of Israel, Open Library, Wikidata and bookstore and publisher sites, and are shown with their source. They are not guaranteed to be accurate or up to date. A purchase on an external site is between you and that site. The app has no commercial relationship with the stores and receives no commissions.","זכויות יוצרים":"Copyright","הכריכות, התקצירים והציטוטים שייכים לבעלי הזכויות בהם. הם מוצגים בהיקף מצומצם, לזיהוי הספר ולמידע, עם ציון המקור. בעל זכויות שמבקש להסיר תוכן: {0}, והתוכן יוסר בהקדם.":"Covers, synopses and quotes belong to their rights holders. They are shown to a limited extent, to identify the book and for information, with their source. A rights holder who wants content removed: {0}, and it will be removed promptly.","התוכן שלכם":"Your content","אתם אחראים למה שאתם כותבים: הערות, המלצות לחברים ומשוב. אסור לכתוב תוכן פוגעני, משמיץ, מפר זכויות או לא חוקי. אתם מרשים לאפליקציה לשמור ולעבד את התוכן רק כדי לתת לכם את השירות.":"You are responsible for what you write: notes, recommendations to friends and feedback. Offensive, defamatory, infringing or illegal content is not allowed. You allow the app to store and process your content only to provide you the service.","שימוש אסור":"Prohibited use","אסור לנסות לפרוץ, לעקוף את הגבלות הכניסה, לאסוף מידע על משתמשים אחרים או להעמיס על השרת.":"Do not try to break in, bypass sign-in limits, collect information about other users or overload the server.","זמינות ואחריות":"Availability and liability","השירות ניתן כמו שהוא (AS IS), בלי התחייבות לזמינות רציפה; מומלץ לייצא גיבוי מדי פעם. ככל שהדין מתיר, מפעיל האפליקציה לא אחראי לנזק עקיף או תוצאתי מהשימוש בה. השירות יכול להשתנות או להיפסק; לפני הפסקה מתוכננת תוצג הודעה באפליקציה, כדי שאפשר יהיה לייצא את הספרייה.":"The service is provided as is, without a commitment to continuous availability; exporting a backup from time to time is recommended. To the extent the law allows, the app's operator is not liable for indirect or consequential damage from using it. The service may change or end; before a planned shutdown a notice will be shown in the app so you can export your library.","הפסקת שימוש":"Ending use","אפשר להפסיק בכל רגע ולמחוק את המשתמש. מפעיל האפליקציה רשאי לחסום חשבון שמפר את התנאים.":"You can stop at any time and delete your user. The app's operator may block an account that breaches these terms.","דין ושיפוט":"Governing law","על התנאים חל הדין הישראלי, וסמכות השיפוט לבתי המשפט המוסמכים בישראל.":"These terms are governed by Israeli law, and the competent courts in Israel have jurisdiction.","יצירת קשר":"Contact","המחויבות שלנו":"Our commitment",'אנחנו רוצים שכל אחד יוכל להשתמש באפליקציה. היא נבנתה לפי תקנות שוויון זכויות לאנשים עם מוגבלות (התאמות נגישות לשירות), התשע"ג-2013, ולפי התקן הישראלי ת"י 5568, המבוסס על הנחיות WCAG 2.0 ברמה AA.':"We want everyone to be able to use the app. It was built according to Israel's Equal Rights for Persons with Disabilities (Service Accessibility Adjustments) Regulations, 5773-2013, and Israeli Standard IS 5568, based on WCAG 2.0 level AA.","מה יש באפליקציה":"What the app offers",'מצב נגישות (הגדרות ← "תצוגה ונגישות"): ניגודיות גבוהה, סימון בולט של המיקום במקלדת, קישורים מודגשים ובלי הנפשות.':'Accessibility mode (Settings → "Display and accessibility"): high contrast, a strong keyboard focus indicator, highlighted links and no animations.',"הגדלת טקסט עד 150%, בחירת גופן, מצב כהה, ושש ערכות צבע שנבדקו לניגודיות ברמה AA.":"Text enlargement up to 150%, a choice of fonts, dark mode, and six colour themes checked for AA contrast.","תמיכה בקוראי מסך: תוויות לכל הכפתורים, כותרות מסודרות והודעות שמוקראות.":"Screen reader support: labels on all buttons, structured headings and announced messages.",'ניווט מלא במקלדת, וקישור "דילוג לתוכן הראשי".':'Full keyboard navigation, and a "Skip to main content" link.',"כפתורים ושטחי לחיצה גדולים, ובלי הגבלות זמן.":"Large buttons and touch targets, and no time limits.","מצב קורא אלקטרוני בשחור-לבן, ממשק בעברית ובאנגלית, ומדריך למשתמש עם חיפוש.":"A black-and-white e-reader mode, Hebrew and English interfaces, and a searchable user guide.","מגבלות ידועות":"Known limitations","נתקלתם בבעיה?":"Found a problem?","ספרו לנו {0}: מה ניסיתם לעשות, באיזה מכשיר ובאיזו טכנולוגיה מסייעת. נחזור אליכם ונתקן בהקדם.":"Tell us {0}: what you tried to do, on which device and with which assistive technology. We will get back to you and fix it as soon as possible.","עודכן: {0}":"Updated: {0}","מידע משפטי":"Legal","קראתי ואני מסכים/ה ל":"I have read and agree to the ","תנאי השימוש":"terms of use"," ול":" and the ","מדיניות הפרטיות":"privacy policy",", כולל שמירת המידע אצל ספקי שירות מחוץ לישראל. אני בן/בת 16 ומעלה, או שהורה הסכים.":", including storing data with service providers outside Israel. I am 16 or older, or a parent has agreed.","עדכנו את תנאי השימוש ואת מדיניות הפרטיות":"We've updated the terms of use and privacy policy","כדי להמשיך, צריך להסכים להם. הם מסבירים מה נשמר, איפה, מי רואה את המידע ואיך מוחקים אותו.":"To continue, please agree to them. They explain what is stored, where, who sees it and how to delete it.","הסכמה והמשך":"Agree and continue","לא עכשיו (יציאה)":"Not now (sign out)","שם משתמש":"User name","Google – חיפוש ספרים ב-Google Books.":"Google – book search in Google Books.","נוצרו הרבה משתמשים בזמן קצר. נסו שוב בעוד רבע שעה.":"Many users were created in a short time. Try again in 15 minutes.",'שאר המשתמשים: השם והצבע שלכם. "אהובים בקהילה" הוא סיכום אנונימי של ספרים ששני משתמשים לפחות דירגו 4 ומעלה, בלי שמות ובלי הערות; אפשר לצאת ממנו בהגדרות.':'Other users: your name and colour. "Community favourites" is an anonymous summary of books that at least two users rated 4 or higher, without names or notes; you can opt out in Settings.',"Anthropic (Claude) – ההמלצות, הפרופיל הספרותי, זיהוי ספרים ותרגום. נשלחים רק הספרים, הדירוגים, ההערות והבקשה, בלי השם שלכם. לפי התנאים של Anthropic, מידע שעובר דרך השירות שלה לא משמש לאימון מודלים.":"Anthropic (Claude) – recommendations, the reader profile, book identification and translation. Only books, ratings, notes and your request are sent, without your name. Under Anthropic's terms, data sent through its service is not used to train models.",'כל עוד המשתמש קיים. מחיקת המשתמש (הגדרות ← "החשבון שלי") מוחקת את הספרייה, ההתראות וההצעות, ומנתקת את כל המכשירים. עותקי הגיבוי של השרת נמחקים לבד תוך 30 יום. מטמון של פרטי ספרים, שאינו מידע אישי, נשמר עד 14 יום.':'As long as the user exists. Deleting the user (Settings → "My account") deletes the library, notifications and suggestions, and signs out every device. Server backups are deleted automatically within 30 days. A cache of book details, which is not personal data, is kept for up to 14 days.',"אסור לנסות לפרוץ, להיכנס לספריות של אחרים בלי רשות, לאסוף מידע על משתמשים אחרים או להעמיס על השרת.":"Do not try to break in, enter other people's libraries without permission, collect information about other users or overload the server.","דפים של אתרים חיצוניים (חנויות, הוצאות) אינם בשליטתנו. לכריכות הספרים אין תיאור נוסף מעבר לשם הספר שמופיע לידן.":"Pages of external sites (stores, publishers) are not under our control. Book covers have no description beyond the book title shown next to them.",'בוחרים את השם שלכם ממסך "של מי הספרייה?" ומקלידים סיסמה. משתמש חדש: "הוספת משתמש", שם, סיסמה ושאלת ביטחון. המכשיר זוכר אתכם לתמיד, כך שבדרך כלל נכנסים רק פעם אחת. משנים סיסמה ושאלת ביטחון בהגדרות ← "החשבון שלי", ושם, בתחתית, גם "התנתקות מהמכשיר" (למשל כשמישהו אחר צריך להשתמש בטלפון).':'Pick your name on the "Whose library is it?" screen and type your password. New user: "Add a user", then a name, a password and a security question. The device remembers you forever, so you usually sign in only once. Change your password and security question in Settings → "My account", where, at the bottom, there is also "Sign out of this device" (for example when someone else needs to use the phone).',"שכחתי סיסמה. מה עושים?":"I forgot my password. What now?",'במסך הכניסה בוחרים את השם, לוחצים "שכחתי סיסמה", עונים על שאלת הביטחון ובוחרים סיסמה חדשה. התשובה לא רגישה לרווחים, למקפים ולאותיות גדולות.':'On the sign-in screen pick your name, tap "Forgot password", answer your security question and choose a new password. The answer ignores spaces, hyphens and capital letters.','הסיסמה נועדה לפרטיות בסיסית בין המשתמשים, לא להגנה חזקה: מי שיודע את התשובה לשאלת הביטחון יכול לאפס אותה. מעבר לזה, כל מכשיר יכול לשנות רק את הספרייה של מי שנכנס בו, חברים רואים רק את מה שבחרתם לשתף (בלי ספרים מוסתרים), ו"אהובים בקהילה" הוא סיכום אנונימי, בלי שמות ובלי הערות.':'The password is for basic privacy between users, not strong protection: anyone who knows the answer to your security question can reset it. Beyond that, each device can change only the library of the person signed in on it, friends see only what you chose to share (no hidden books), and "Community favourites" is an anonymous summary, without names or notes.',"מה השם של בית הספר היסודי שלך?":"What was the name of your primary school?","מה הספר הראשון שאהבת?":"What was the first book you loved?","מה השם של החבר או החברה הכי טובים שלך בילדות?":"What was the name of your best childhood friend?","הסיסמה לא נכונה. נסו שוב.":"Wrong password. Try again.","התשובה לא נכונה. נסו שוב.":"Wrong answer. Try again.","סיסמה של {0} תווים לפחות.":"At least {0} characters.","בחרו שאלת ביטחון.":"Choose a security question.","התשובה קצרה מדי.":"The answer is too short.","למשתמש הזה אין שאלת ביטחון. בקשו ממי שיכול להיכנס אליו לשנות את הסיסמה בהגדרות.":"This user has no security question. Ask someone who can sign in to it to change the password in Settings.","הסתרת הסיסמה":"Hide password","הצגת הסיסמה":"Show password","שאלת ביטחון (לשחזור הסיסמה)":"Security question (to recover your password)","בחירת שאלה…":"Choose a question…",התשובה:"Answer","פרטי חשבון: שם או כינוי שבחרתם, סיסמה, ושאלת ביטחון עם התשובה שלכם. הסיסמה והתשובה נשמרות רק כגיבוב, כך שאי אפשר לקרוא אותן. לא נאספים מייל או טלפון.":"Account details: the name or nickname you chose, a password, and a security question with your answer. The password and answer are stored only as hashes, so they can't be read. No email or phone number is collected.","חשוב: הסיסמה היא לפרטיות בסיסית בין המשתמשים, לא הגנה חזקה. רשימת השמות גלויה במסך הכניסה, ומי שיודע את התשובה לשאלת הביטחון שלכם יכול לאפס את הסיסמה. לכן אל תכתבו באפליקציה מידע רגיש.":"Important: the password is for basic privacy between users, not strong protection. The list of names is visible on the sign-in screen, and anyone who knows the answer to your security question can reset your password. So don't write sensitive information in the app.","הסיסמה והתשובה לשאלת הביטחון נבדקות בשרת ונשמרות רק כגיבוב, ניסיונות שגויים מוגבלים, כל התקשורת מוצפנת (HTTPS), כל מכשיר יכול לשנות רק את הספרייה של מי שנכנס בו, וספריות של משתמשים אחרים לא נשלחות אליו, חוץ ממה שחברים שיתפו. זו לא אבטחה חזקה; אם גיליתם בעיה, ספרו לנו.":"The password and security answer are checked on the server and stored only as hashes, wrong attempts are limited, all traffic is encrypted (HTTPS), each device can change only the library of the person signed in on it, and other users' libraries are not sent to it, except what friends shared. This is not strong security; if you find a problem, let us know.","השימוש מגיל 16, או בהסכמת הורה. משתמש אחד לכל אדם, בלי להתחזות למישהו אחר. שמרו על הסיסמה ועל התשובה לשאלת הביטחון, ואל תיכנסו לספרייה של מישהו אחר או תשנו אותה בלי רשותו.":"Use is from age 16, or with a parent's consent. One user per person, without impersonating anyone. Keep your password and security answer to yourself, and don't enter or change someone else's library without their permission.","למשתמש הזה עוד אין סיסמה. בחרו סיסמה ושאלת ביטחון, כדי שאפשר יהיה לשחזר אותה.":"This user has no password yet. Choose a password and a security question, so it can be recovered.","סיסמה חדשה":"New password","שכחתי סיסמה":"Forgot password","הסיסמה נשמרה":"Password saved","שאלת הביטחון נשמרה":"Security question saved","קביעת סיסמה":"Set a password","שינוי סיסמה":"Change password","שמירת הסיסמה":"Save password","שמירת שאלת הביטחון":"Save security question","מה היה הכינוי שלך?":"What was your nickname?","באיזה בית חולים נולדת?":"In which hospital were you born?","זכה/תה באותו פרס כמו {0}: {1}":"Won the same award as {0}: {1}","מאותה תנועה ספרותית כמו {0}":"Same literary movement as {0}","קשר של השפעה ספרותית עם {0}":"Literary influence link with {0}","מתאים לבקשה: {0}":"Matches your request: {0}","ספר חדש של {0} ({1})":"New book by {0} ({1})","אהוב בקהילה ({0})":"Community favourite ({0})","רק {0} ספרים עברו את האימות. מבקש מ-Claude עוד הצעות…":"Only {0} books passed verification. Asking Claude for more suggestions…","מחוץ לאזור הנוחות: ספר מסוג שכמעט לא מופיע בספרייה שלך":"Outside your comfort zone: a kind of book that hardly appears in your library","איך נבחרות ההמלצות?":"How are recommendations chosen?",'לפני ש-Claude חושב, האפליקציה מחפשת בעצמה ספרים אמיתיים: לפי מה שביקשתם עכשיו, ספרים נוספים (וחדשים) של סופרים שאהבתם, סופרים קרובים אליהם (השפעה ספרותית, אותה תנועה, אותו פרס), מה שחברים והקהילה אהבו, וז\'אנרים שאתם אוהבים. Claude בוחר מתוכם ומוסיף משלו, כל ספר נבדק במאגרים, ואם חסרים – הוא מתבקש להשלים. בסוף ההמלצות מדורגות לפי הטעם שלכם ומה שעבד בהמלצות קודמות, ספר אחד לכל סופר, ולפעמים ספר אחד "מחוץ לאזור הנוחות".':`Before Claude thinks, the app itself looks for real books: by what you asked for right now, more (and new) books by authors you loved, authors close to them (literary influence, the same movement, the same award), what friends and the community loved, and genres you like. Claude chooses among them and adds its own, every book is checked in the catalogues, and if some are missing it's asked to fill the gap. Finally the recommendations are ranked by your taste and by what worked in earlier recommendations, one book per author, and sometimes one book "outside your comfort zone".`,"לחצו שוב כדי להתנתק מהמכשיר הזה":"Tap again to sign out of this device","התנתקות מהמכשיר":"Sign out of this device"} איך מתחילים?"),t('בוחרים שם. בכניסה הראשונה בוחרים אילו סוגות להציג (למשל בלי ספרי ילדים), ואז נפתחת רשימה של ספרים מוכרים: החלקה ימינה = קראתי (ואז בוחרים דירוג), שמאלה = לא קראתי, והסימנייה = רוצה לקרוא. אפשר לדלג ולחזור אליה מהכרטיס שבראש "הספרים שלי".')],[t("איך מתקינים את האפליקציה על מסך הבית?"),t('באייפון: פותחים ב-Safari, לוחצים על כפתור השיתוף ובוחרים "הוספה למסך הבית". באנדרואיד: בכרום, בתפריט ⋮ בוחרים "התקנת האפליקציה", או לוחצים על ההודעה שמופיעה באפליקציה.')],[t("איך חוזרים לרשימת הספרים המוכרים?"),t('בהגדרות ← "המלצות" ← "רשימת 400 הספרים המוכרים": "המשך מאיפה שעצרתי" או "מההתחלה". יש גם קישור בתחתית לשונית "הוספת ספר". ספרים שכבר בספרייה לא מוצגים שוב.')],[t("איך נכנסים?"),t('בוחרים את השם שלכם ממסך "של מי הספרייה?" ומקלידים סיסמה. משתמש חדש: "הוספת משתמש", שם, סיסמה ושאלת ביטחון. המכשיר זוכר אתכם לתמיד, כך שבדרך כלל נכנסים רק פעם אחת. משנים סיסמה ושאלת ביטחון בהגדרות ← "החשבון שלי", ושם, בתחתית, גם "התנתקות מהמכשיר" (למשל כשמישהו אחר צריך להשתמש בטלפון).')],[t("שכחתי סיסמה. מה עושים?"),t('במסך הכניסה בוחרים את השם, לוחצים "שכחתי סיסמה", עונים על שאלת הביטחון ובוחרים סיסמה חדשה. התשובה לא רגישה לרווחים, למקפים ולאותיות גדולות.')],[t("הספרייה שלי מוגנת?"),t('הסיסמה נועדה לפרטיות בסיסית בין המשתמשים, לא להגנה חזקה: מי שיודע את התשובה לשאלת הביטחון יכול לאפס אותה. מעבר לזה, כל מכשיר יכול לשנות רק את הספרייה של מי שנכנס בו, חברים רואים רק את מה שבחרתם לשתף (בלי ספרים מוסתרים), ו"אהובים בקהילה" הוא סיכום אנונימי, בלי שמות ובלי הערות.')],[t("איפה מדיניות הפרטיות, תנאי השימוש והצהרת הנגישות?"),t('בהגדרות ← "מידע משפטי ונגישות", וגם בתחתית מסך הכניסה. שם כתוב מה נשמר, איפה, מי רואה את המידע, ואיך מעיינים בו, מתקנים או מוחקים אותו.')],[t("כמה משתמשים יכולים להשתמש בה?"),t("כל אחד במשפחה מקבל ספרייה, דירוגים והמלצות משלו. מחליפים משתמש בלחיצה על השם שבראש המסך.")],[t("הנתונים שלי נשמרים?"),t("הכול נשמר בטלפון ומסתנכרן אוטומטית, כך שהספרייה זמינה בכל מכשיר. הנקודה הירוקה ליד השם אומרת שהכול מסונכרן; כתומה = אין חיבור כרגע, והנתונים יסונכרנו כשיחזור.")]]},{id:"library",title:t("הספרים שלי"),icon:"Library",intro:t("הספרייה האישית: ארבעה מדפים, חיפוש, מיון, תגיות וסטטיסטיקות."),qa:[[t("מה ההבדל בין המדפים?"),t('"קראתי" – ספרים שסיימת, עם דירוג. "קורא עכשיו" – ספרים שבאמצע. "רוצה לקרוא" – רשימת המשאלות. "קראתי חלקית" – ספרים שהפסקת באמצע (הדירוג רשות, ועוזר להמלצות).')],[t("אפשר לסמן סדרה שלמה?"),t('כן. כשספר הוא חלק מסדרה, מופיע בחלון שלו (וגם בתוצאות החיפוש) "ספר X מתוך Y בסדרה". לוחצים "סימון כל הסדרה", בוחרים אילו ספרים, מדף ודירוג, וכל ספר נבדק במאגרים לפני שהוא נכנס. המידע על הסדרות מגיע מ-Wikidata, ומוצג רק כשהוא חד-משמעי: אותו מחבר, ומספר לכל ספר בסדרה.')],[t("איך מסמנים שסיימתי ספר?"),t('בספר שנמצא ב"קורא עכשיו" יש כפתור "סיימתי". בוחרים מתי (היום, אתמול או חודש) ומדרגים.')],[t("איך עורכים או מוחקים ספר?"),t('לוחצים על הספר, ובחלון שנפתח בוחרים "עריכה" או "מחיקה".')],[t("אפשר לראות את הספרים כקוביות?"),t("כן. ליד החיפוש יש מתג בין רשימה לקוביות, ותפריט מיון (חדשים, מתי קראתי, שנת הוצאה, דירוג, א–ת).")],[t("איפה הסטטיסטיקות?"),t(`בראש "הספרים שלי": מספר הספרים, הדירוג הממוצע, האהובים והשנה, ו"סטטיסטיקות לפי ז'אנר" עם פירוט לפי סוגה, מדינה, שנה וסופר.`)],[t("מאיפה יודעים מאיזו מדינה כל ספר?"),t("המדינה נקבעת לפי הסופר/ת, אוטומטית ברקע. המדינה מופיעה ליד הספר, בסטטיסטיקות ובסיכום, וההמלצות מתחשבות בה.")]]},{id:"add",title:t("הוספת ספרים"),icon:"BookPlus",intro:t("שלוש דרכים להוסיף: ספר אחד, רשימה, או טקסט חופשי. רק ספרים שנמצאו במאגרים נכנסים לספרייה."),qa:[[t("איך מוסיפים ספר אחד?"),t('בלשונית "הוספת ספר" כותבים שם בעברית או באנגלית, ISBN או קישור לדף הספר. בוחרים את הספר (ואם רוצים, את המהדורה המדויקת), ואז את המדף והדירוג.')],[t("יש לי רשימה של הרבה ספרים"),t('בוחרים "רשימה" ומדביקים ספר בכל שורה (אפשר להוסיף מחבר אחרי מקף). עוברים על הספרים אחד אחרי השני, ואפשר לדייק או לחפש מחדש.')],[t("אפשר פשוט לכתוב מה קראתי?"),t('כן. ב"טקסט חופשי" כותבים בחופשיות, ו-Claude מזהה את הספרים. אחר כך בוחרים ומדרגים כל אחד.')],[t("מאיפה מגיעים התקציר והקישורים לחנויות?"),t('לכל ספר האפליקציה מחפשת את דף הספר אצל ההוצאה ובחנויות (עברית, סטימצקי, צומת ספרים ועוד), ומשם מביאה את התקציר המקורי וקישור ישיר. התקציר מועתק מהדף כמו שהוא, ונבדק שהוא באמת מופיע שם. הכול נשמר עם הספר ומתעדכן מעצמו; אם לא נמצא, יש כפתור "חיפוש מחדש".')],[t("למה ספר לא נמצא?"),t('כל ספר נבדק מול Google Books, הספרייה הלאומית, Open Library והחנויות. אפשר לנסות את השם המלא, איות אחר, את השם בשפת המקור, ISBN מהכריכה האחורית, או "זיהוי חכם".')],[t("אפשר לייבא מ-Goodreads או StoryGraph?"),t('כן: הגדרות ← "ייצוא וייבוא" ← "ייבוא מקובץ CSV". כל ספר נבדק, ומה שלא אומת מחכה ברשימה בלשונית ההוספה.')]]},{id:"recs",title:t("המלצות"),icon:"Sparkles",intro:t("Claude קורא את הפרופיל הספרותי שלך וממליץ, וכל המלצה נבדקת מול המאגרים והחנויות לפני שהיא מוצגת."),qa:[[t("איך נבחרות ההמלצות?"),t(`לפני ש-Claude חושב, האפליקציה מחפשת בעצמה ספרים אמיתיים: לפי מה שביקשתם עכשיו, ספרים נוספים (וחדשים) של סופרים שאהבתם, סופרים קרובים אליהם (השפעה ספרותית, אותה תנועה, אותו פרס), מה שחברים והקהילה אהבו, וז'אנרים שאתם אוהבים. Claude בוחר מתוכם ומוסיף משלו, כל ספר נבדק במאגרים, ואם חסרים – הוא מתבקש להשלים. בסוף ההמלצות מדורגות לפי הטעם שלכם ומה שעבד בהמלצות קודמות, ספר אחד לכל סופר, ולפעמים ספר אחד "מחוץ לאזור הנוחות".`)],[t("איך מקבלים המלצה?"),t(`בלשונית "גלה ספר חדש" כותבים מה בא לך, בוחרים מיקוד (מצב רוח, ז'אנר, תקופה ועוד) ולוחצים "המלצה חכמה". Claude ישאל 2–4 שאלות קצרות לדיוק (אפשר לדלג או להחליף שאלה).`)],[t("כמה זמן זה לוקח?"),t("בדרך כלל דקה-שתיים. אפשר לצאת מהאפליקציה: ההמלצה ממשיכה בשרת, ואפשר לקבל התראה כשהיא מוכנה.")],[t("למה אפשר לסמוך על ההמלצות?"),t("כל ספר שהמודל מציע נבדק מול הספרייה הלאומית, Google Books והחנויות; ספר שלא נמצא נפסל. בכל המלצה מופיעים זמינות (מודפס, דיגיטלי, קולי), קישורים לרכישה וביקורות מאתרים מוכרים.")],[t("ההמלצות לא מתאימות לי"),t('כותבים בתיבה "לא בדיוק זה?" מה לא מתאים, ומקבלים הצעות מעודכנות. על ספר מסוים לוחצים "לא בשבילי" ובוחרים לחודש או לתמיד, עם הערה שמדייקת את הפרופיל.')],[t("איפה כל ההמלצות שקיבלתי?"),t('בלשונית "גלה ספר חדש" ← "כל ההמלצות": כל ההמלצות מהשיחות ומההצעות הדו-שבועיות. מסמנים "טובה" או "לא טובה", ואפשר להוסיף למה (רשות). הטובות מופיעות למעלה, אלה שלא התאימו מוצנעות בסוף הרשימה, והסימונים מלמדים את ההמלצות הבאות ואת הפרופיל הספרותי.')],[t("באיזו שפה הספרים?"),t('בשאלון מסמנים עברית, אנגלית ו/או שפות זרות. ברירת המחדל: עברית ואנגלית. משנים אותה בהגדרות ← "המלצות" ← "שפות ברירת המחדל להמלצות".')],[t("אפשר לקבל המלצה רק מתוך הספרים שלי?"),t('כן. ב"גלה ספר חדש" בוחרים "מהספרים שלי": Claude בוחר את הספר הבא מתוך רשימת "רוצה לקרוא" (וספרים שהתחלת והפסקת), לפי הבקשה והטעם שלך, בלי לחפש ספרים חדשים.')],[t('מה זה "ספר בשביל מישהו אחר"?'),t('מצב מתנה: מתארים את מי שמקבל את הספר, וההמלצה לא נשענת על הטעם שלך ולא משנה אותו. ספר שנשמר נכנס ל"רוצה לקרוא" עם התגית "מתנה".')],[t("איך ההמלצות מתחשבות במתי קראתי?"),t("לכל ספר יש משקל: כמה אהבת אותו, כפול כמה הוא עדכני. ספר מאתמול שווה פי שניים מספר מלפני 3 שנים, ופי 8 בערך מספר מלפני 10 שנים. למודל נשלחים רק הספרים שהכי מעידים על הטעם שלך היום, וכך ההמלצה מדויקת וזולה יותר.")],[t("אפשר שההמלצות לא יתחשבו בספר מסוים?"),t('כן. לוחצים על הספר ומכבים "להתחשב בספר בהמלצות". הספר נשאר בספרייה ולא יומלץ שוב, אבל לא משפיע על הטעם. כשמסמנים ספר שנקרא לפני 5 שנים ויותר, האפליקציה שואלת על כך בעצמה.')],[t("מה זה הפרופיל הספרותי?"),t('תקציר של הטעם שלך, שנבנה מהספרים, מהדירוגים ומההערות, ומתעדכן לבד. הוא לוקח בחשבון מתי קראת כל ספר, כדי לזהות לאן הטעם מתפתח. בראש "גלה ספר חדש" הוא מקופל; לוחצים עליו כדי לקרוא, לעדכן או להוסיף הערה משלך.')],[t("מה ההצעות הדו-שבועיות?"),t("כל שבועיים נבחרים 10 ספרים חדשים לפי מה שקראת, בלי ספרים שכבר הוצעו או שקראת. הם מופיעים בראש המסך, ואפשר לקבל התראה.")]]},{id:"summary",title:t("סיכום הקריאה"),icon:"ChartColumn",intro:t("דוח על הקריאה שלך: כמה, מה, מתי ואיך, לשבועיים, לחודש, לשנה או לכל הזמן."),qa:[[t("איפה הסיכום?"),t('כשיש סיכום חדש מופיע כרטיס בראש "הספרים שלי". אחרי שצפית בו, הוא עובר לקישור "סיכום הקריאה" ליד הסטטיסטיקות.')],[t("מה יש בו?"),t("ספרים ועמודים (בהשוואה לתקופה הקודמת), דירוג ממוצע וקצב, סוג הקריאה, הספר של התקופה, סוגות, עשורי כתיבה, סופרים, התפלגות דירוגים, אורך, שפה ומקור, וקצב לאורך התקופה.")],[t("למה חלק מהספרים לא נספרים?"),t("הסיכום סופר רק ספרים עם תאריך סיום. ספרים שסומנו מרשימת המוכרים אין להם תאריך; אפשר לערוך ספר ולבחור מתי קראת אותו.")],[t("אפשר לשתף?"),t('כן: "שיתוף כתמונה" בסוף הסיכום יוצר תמונה לשיתוף או לשמירה.')]]},{id:"friends",title:t("חברים"),icon:"Users",intro:t("רואים מה החברים קוראים ואוהבים, ממליצים אחד לשני ומגלים ספרים דרכם."),qa:[[t("איך מוסיפים חבר?"),t('בלשונית "חברים" ← "להוסיף חברים" ← "בקשת חברות". אחרי שהחבר מאשר, רואים את המדפים שלו.')],[t("איך מסתירים ספר מסוים מחברים?"),t('לוחצים על הספר ב"הספרים שלי" ומפעילים "הסתרה מחברים". הספר נשאר אצלך, אבל לא מופיע במדף שלך אצל החברים, בהמלצות שלהם וב"אהובים בקהילה". ליד ספר מוסתר מופיע סימן של עין מחוקה.')],[t("מה החברים רואים עליי?"),t('בוחרים בהגדרות ← "פרטיות וחברים": ספרים שקראת ודירוגים, רשימת "רוצה לקרוא", הערות, והופעה בלי שם ב"אהובים בקהילה".')],[t("איך ממליצים לחבר?"),t('במדף של חבר או בספר שלך לוחצים "להמליץ", בוחרים חבר (או כל החברים) ומוסיפים משפט.')]]},{id:"notify",title:t("התראות"),icon:"Bell",intro:t("התראה כשההמלצה מוכנה, וכשמגיעים הסיכום וההצעות הדו-שבועיות."),qa:[[t("איך מפעילים התראות?"),t('בהגדרות ← "התראות" ← "התראה כשיש הצעות חדשות", ומאשרים בחלון של הטלפון. אפשר גם מהשורה שמופיעה בזמן שההמלצה מתגבשת.')],[t("באייפון לא מגיעות התראות"),t("באייפון התראות עובדות רק אחרי התקנה על מסך הבית (iOS 16.4 ומעלה), ורק כשפותחים את האפליקציה משם.")]]},{id:"look",title:t("תצוגה ונגישות"),icon:"Palette",intro:t("אפשר להתאים את המראה, הגופן והגודל, ולהפעיל מצב נגישות."),qa:[[t("איך משנים צבעים?"),t('בהגדרות ← "תצוגה ונגישות": שש ערכות (נייר וקלף, ספרייה ישנה, דיו כחול, אבן ירושלמית, שזיף ולבנדר, ים תיכון) או "מתחלף כל יום", ובחירה בין בהיר, כהה או לפי המכשיר.')],[t("איך מגדילים את הטקסט?"),t('בהגדרות ← "תצוגה ונגישות" ← "גודל הטקסט": א+ להגדלה וא- להקטנה, מ-90% עד 150%. אפשר גם לבחור גופן: פרנק רוהל, דוד, אסיסטנט או אלף.')],[t("מה עושה מצב נגישות?"),t('ניגודיות גבוהה, טקסט גדול יותר, קישורים עם קו תחתון, מסגרת מיקוד בולטת, בלי אנימציות ואזורי לחיצה גדולים, לפי ת
