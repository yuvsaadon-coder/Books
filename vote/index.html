<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>איך מחליטים</title>
<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#1d2430; --muted:#5a6473; --line:#d9d5ca;
  --a:#0f766e; --a-soft:#d9f0ec; --b:#9a5b00; --b-soft:#fbead0;
  --accent:#27408b; --accent-ink:#ffffff; --warn:#8a2d1d; --warn-soft:#fbe4df;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14181f; --card:#1d232d; --ink:#eef1f5; --muted:#a3adbb; --line:#323b49;
    --a:#5fd1c4; --a-soft:#173532; --b:#f0b45a; --b-soft:#3a2c14;
    --accent:#8fa8f2; --accent-ink:#10162a; --warn:#ff9d8a; --warn-soft:#3b1d18;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.5rem;margin:8px 0 4px}
h2{font-size:1.25rem;margin:8px 0 12px}
h3{font-size:1.05rem;margin:0 0 8px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.steps{display:flex;gap:6px;margin:4px 0 18px}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 20px;font-weight:600;min-height:48px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
textarea{min-height:96px;resize:vertical}
.coals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.coal{border-radius:var(--radius);padding:12px;border:2px solid}
.coal.A{border-color:var(--a);background:var(--a-soft)}
.coal.B{border-color:var(--b);background:var(--b-soft)}
.coal .tot{font-size:1.6rem;font-weight:700;line-height:1.2}
.coal .st{font-size:.9rem}
.coal.A .tot{color:var(--a)} .coal.B .tot{color:var(--b)}
.coal input{background:var(--card);font-weight:600}
.party{display:grid;grid-template-columns:1fr 70px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.party:last-child{border-bottom:0}
.party .pname{font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--card);border:0;padding:8px 12px;min-height:44px;min-width:46px;border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed=true][data-g=A]{background:var(--a);color:var(--bg);font-weight:700}
.seg button[aria-pressed=true][data-g=B]{background:var(--b);color:var(--bg);font-weight:700}
.seg button[aria-pressed=true][data-g=out]{background:var(--muted);color:var(--bg);font-weight:700}
.issues{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.issue{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px 12px;text-align:start;min-height:56px}
.issue[aria-pressed=true]{border-color:var(--accent);background:var(--bg);font-weight:700}
.issue:disabled{opacity:.45;cursor:not-allowed}
.issue .tick{float:inline-end;color:var(--accent)}
.add{display:flex;gap:8px;margin-top:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{border-radius:var(--radius);padding:12px;border:2px solid}
.col.A{border-color:var(--a);background:var(--a-soft)} .col.B{border-color:var(--b);background:var(--b-soft)}
.col h3{display:flex;justify-content:space-between;gap:8px}
.col .ps{font-size:.9rem;color:var(--muted);margin-bottom:8px}
.col textarea{background:var(--card)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.pick button{border-radius:12px;padding:14px 10px;border:2px solid var(--line);background:var(--card);min-height:56px;font-weight:600}
.pick button[data-g=A]{border-color:var(--a)} .pick button[data-g=B]{border-color:var(--b)}
.pick button[aria-pressed=true][data-g=A]{background:var(--a);color:var(--bg)}
.pick button[aria-pressed=true][data-g=B]{background:var(--b);color:var(--bg)}
.verdict{text-align:center;padding:20px 14px}
.verdict .big{font-size:1.5rem;font-weight:800;margin-bottom:4px}
.verdict.A{background:var(--a-soft);border-color:var(--a)} .verdict.B{background:var(--b-soft);border-color:var(--b)}
.row{display:flex;gap:10px;align-items:baseline;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.badge{display:inline-block;font-size:.8rem;border-radius:999px;padding:2px 10px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.95rem}
.pp{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:start;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;min-height:56px}
.pp[aria-pressed=true]{border-color:var(--accent);background:var(--bg);font-weight:700}
.note{white-space:pre-wrap;font-size:.95rem;color:var(--muted);margin:2px 0 0}
footer{margin-top:28px;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
footer a{color:var(--accent)}
@media (max-width:560px){
  .coals,.cols,.issues{grid-template-columns:1fr}
  .party{grid-template-columns:1fr 64px;}
  .party .seg{grid-column:1 / -1}
  .seg button{flex:1}
}
@media print{.actions,.steps,.noprint{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="steps" id="steps" aria-hidden="true"></div>
  <main id="app" tabindex="-1" aria-live="polite"></main>
  <footer>
    לא נשמר שום מידע. כל מה שכתבתם נמצא בזיכרון הדף בלבד, וריענון או סגירה מוחקים הכול. הדף לא שולח שום בקשה לשום שרת.
    <br>מנדטים ברירת מחדל: הסקר האחרון של כאן 11, 23.10.2026 (אפשר לשנות כל מספר).
    <a href="https://www.ynetnews.com/article/s1wppltnme" target="_blank" rel="noopener noreferrer">מקור</a>
  </footer>
</div>
<script>
'use strict';

const THRESHOLD_SEATS = 5;   // עד 5 מנדטים נחשב "קרוב לאחוז החסימה"
const NEEDED = 61;
const ISSUE_COUNT = 3;

const POLL = [
  ['ישר! (איזנקוט)', 22],
  ['הליכוד', 20],
  ['ביחד (בנט)', 14],
  ['הרשימה המשותפת', 9],
  ['הדמוקרטים', 8],
  ['עוצמה יהודית', 8],
  ['ישראל ביתנו', 8],
  ['יהדות התורה', 8],
  ['ש"ס', 7],
  ['הציונות הדתית – זהות', 7],
  ['רע"מ', 5],
  ['המילואימניקים – המפלגה הכלכלית', 4]
];

const ISSUES = [
  'ביטחון והמלחמה', 'יוקר המחיה', 'דיור', 'מערכת המשפט', 'גיוס והשוויון בנטל',
  'דת ומדינה', 'חינוך', 'בריאות', 'יחסי חוץ והקשר עם ארצות הברית',
  'הסכסוך הישראלי־פלסטיני', 'תחבורה ותשתיות', 'החברה הערבית ופשיעה',
  'שחיתות ושלטון תקין', 'סביבה ואקלים'
];

function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function fresh(){
  return {
    step: 0,
    names: { A: 'קואליציה א׳', B: 'קואליציה ב׳' },
    parties: POLL.map(([name, seats], i) => ({ id: i, name, seats, group: 'out' })),
    issueList: shuffle(ISSUES),
    picked: [],
    idx: 0,
    notes: {},
    choice: {},
    party: null
  };
}

let S = fresh();
const $app = document.getElementById('app');
const $steps = document.getElementById('steps');

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seatsOf = g => S.parties.filter(p => p.group === g).reduce((n, p) => n + (p.seats || 0), 0);
const partiesOf = g => S.parties.filter(p => p.group === g);
const nameOf = g => (S.names[g] || '').trim() || (g === 'A' ? 'קואליציה א׳' : 'קואליציה ב׳');

function status(g){
  const n = seatsOf(g);
  return n >= NEEDED ? 'יש רוב (' + (n - NEEDED + 1) + ' מעל הרף)' : 'חסרים ' + (NEEDED - n) + ' ל־61';
}

function go(step){
  S.step = step;
  render();
  $app.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

function render(){
  $steps.innerHTML = [1,2,3,4].map(i => '<span class="' + (S.step >= i ? 'on' : '') + '"></span>').join('');
  [intro, coalitions, issues, compare, result][S.step]();
}

/* ---------- 0: פתיחה ---------- */
function intro(){
  $app.innerHTML =
    '<h1>איך מחליטים למי להצביע</h1>' +
    '<div class="card">' +
    '<p>הכלי הזה לא ממליץ על מפלגה. הוא מוביל אתכם בארבעה צעדים, וההכרעה נשארת שלכם:</p>' +
    '<ol>' +
    '<li>מרכיבים שתי קואליציות אפשריות, כפי שאתם מעריכים שיקרה.</li>' +
    '<li>בוחרים שלוש סוגיות שחשובות לכם ושסביר שיעמדו על השולחן.</li>' +
    '<li>בכל סוגיה כותבים מה לדעתכם כל קואליציה תעשה <strong>בפועל</strong>, ובוחרים מי עדיפה.</li>' +
    '<li>שלוש סוגיות ושתי קואליציות לא מסתיימות בתיקו, ולכן תמיד יש הכרעה. רק אחריה בוחרים מפלגה.</li>' +
    '</ol>' +
    '<p class="muted">מה שנחשב: מה שישתנה במציאות, כוחה של כל מפלגה במשא ומתן, ומה שמסתבר שיקרה. מה שלא נחשב: סיסמאות, הצהרות ורגשות.</p>' +
    '</div>' +
    '<div class="actions"><span></span><button class="btn" id="go">מתחילים</button></div>';
  document.getElementById('go').onclick = () => go(1);
}

/* ---------- 1: קואליציות ---------- */
function coalitions(){
  $app.innerHTML =
    '<h2>הרכבת שתי קואליציות</h2>' +
    '<p>לכל מפלגה סמנו אם היא בקואליציה א׳, בקואליציה ב׳ או בחוץ. אפשר לשנות את מספר המנדטים לפי ההערכה שלכם, ולתת לכל קואליציה שם.</p>' +
    '<div class="coals">' + ['A','B'].map(g =>
      '<div class="coal ' + g + '">' +
      '<input type="text" data-name="' + g + '" value="' + esc(S.names[g]) + '" aria-label="שם הקואליציה ' + (g === 'A' ? 'א' : 'ב') + '" maxlength="40">' +
      '<div class="tot" id="tot' + g + '"></div><div class="st" id="st' + g + '"></div></div>').join('') + '</div>' +
    '<div class="card">' + S.parties.map(p =>
      '<div class="party" data-id="' + p.id + '">' +
      '<div class="pname">' + esc(p.name) + '</div>' +
      '<input type="number" inputmode="numeric" min="0" max="120" value="' + p.seats + '" aria-label="מנדטים של ' + esc(p.name) + '">' +
      '<div class="seg" role="group" aria-label="שיוך ' + esc(p.name) + '">' +
      ['A','B','out'].map(g => '<button type="button" data-g="' + g + '" aria-pressed="' + (p.group === g) + '">' + (g === 'A' ? 'א׳' : g === 'B' ? 'ב׳' : 'בחוץ') + '</button>').join('') +
      '</div></div>').join('') + '</div>' +
    '<div id="coalWarn"></div>' +
    '<div class="actions"><button class="btn ghost" id="back">חזרה</button><button class="btn" id="next">המשך לבחירת סוגיות</button></div>';

  function upd(){
    ['A','B'].forEach(g => {
      document.getElementById('tot' + g).textContent = seatsOf(g) + ' מנדטים';
      document.getElementById('st' + g).textContent = status(g);
    });
    const total = S.parties.reduce((n, p) => n + (p.seats || 0), 0);
    const w = [];
    if (total !== 120) w.push('סך כל המנדטים הוא ' + total + ' ולא 120.');
    ['A','B'].forEach(g => { if (partiesOf(g).length && seatsOf(g) < NEEDED) w.push(esc(nameOf(g)) + ' לא מגיעה ל־61 לפי המספרים. אפשר להמשיך, וכדאי לזכור את זה בהמשך.'); });
    document.getElementById('coalWarn').innerHTML = w.map(t => '<div class="warn">' + t + '</div>').join('');
    document.getElementById('next').disabled = !(partiesOf('A').length && partiesOf('B').length);
  }
  $app.querySelectorAll('[data-name]').forEach(el => el.oninput = () => { S.names[el.dataset.name] = el.value; });
  $app.querySelectorAll('.party').forEach(row => {
    const p = S.parties[+row.dataset.id];
    row.querySelector('input').oninput = e => { p.seats = Math.max(0, Math.min(120, parseInt(e.target.value, 10) || 0)); upd(); };
    row.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
      p.group = b.dataset.g;
      row.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
      upd();
    });
  });
  document.getElementById('back').onclick = () => go(0);
  document.getElementById('next').onclick = () => go(2);
  upd();
}

/* ---------- 2: סוגיות ---------- */
function issues(){
  $app.innerHTML =
    '<h2>בחירת שלוש סוגיות</h2>' +
    '<p>בחרו בדיוק שלוש סוגיות שהכי חשובות לכם ושסביר שבאמת יעמדו על שולחן הקואליציה הבאה. סוגיה חשובה שאף קואליציה לא תיגע בה לא שייכת לכאן. סדר הרשימה אקראי.</p>' +
    '<div class="issues" id="il"></div>' +
    '<div class="add"><input type="text" id="custom" maxlength="40" placeholder="סוגיה אחרת" aria-label="הוספת סוגיה אחרת"><button class="btn ghost" id="addBtn" type="button">הוספה</button></div>' +
    '<p class="muted" id="cnt" style="margin-top:12px"></p>' +
    '<div class="actions"><button class="btn ghost" id="back">חזרה</button><button class="btn" id="next">המשך להשוואה</button></div>';

  function draw(){
    const full = S.picked.length >= ISSUE_COUNT;
    document.getElementById('il').innerHTML = S.issueList.map((t, i) => {
      const on = S.picked.includes(t);
      return '<button type="button" class="issue" data-t="' + i + '" aria-pressed="' + on + '"' + (full && !on ? ' disabled' : '') + '>' +
        (on ? '<span class="tick" aria-hidden="true">✓</span>' : '') + esc(t) + '</button>';
    }).join('');
    document.getElementById('cnt').textContent = 'נבחרו ' + S.picked.length + ' מתוך ' + ISSUE_COUNT;
    document.getElementById('next').disabled = S.picked.length !== ISSUE_COUNT;
    document.querySelectorAll('.issue').forEach(b => b.onclick = () => {
      const t = S.issueList[+b.dataset.t];
      S.picked = S.picked.includes(t) ? S.picked.filter(x => x !== t) : S.picked.concat(t);
      draw();
    });
  }
  function add(){
    const el = document.getElementById('custom');
    const t = el.value.trim();
    if (!t) return;
    if (!S.issueList.includes(t)) S.issueList.push(t);
    if (!S.picked.includes(t) && S.picked.length < ISSUE_COUNT) S.picked.push(t);
    el.value = '';
    draw();
  }
  document.getElementById('addBtn').onclick = add;
  document.getElementById('custom').onkeydown = e => { if (e.key === 'Enter') add(); };
  document.getElementById('back').onclick = () => go(1);
  document.getElementById('next').onclick = () => { S.idx = 0; go(3); };
  draw();
}

/* ---------- 3: השוואה לכל סוגיה ---------- */
function compare(){
  const issue = S.picked[S.idx];
  const n = (S.notes[issue] = S.notes[issue] || { A: '', B: '' });
  const last = S.idx === ISSUE_COUNT - 1;
  $app.innerHTML =
    '<p class="muted">סוגיה ' + (S.idx + 1) + ' מתוך ' + ISSUE_COUNT + '</p>' +
    '<h2>' + esc(issue) + '</h2>' +
    '<p>מה כל קואליציה תעשה בפועל בנושא הזה? חשבו על כוחה של כל מפלגה, על מה היא תילחם ועל מה תוותר במשא ומתן.</p>' +
    '<div class="cols">' + ['A','B'].map(g =>
      '<div class="col ' + g + '"><h3><span>' + esc(nameOf(g)) + '</span><span>' + seatsOf(g) + '</span></h3>' +
      '<div class="ps">' + partiesOf(g).map(p => esc(p.name) + ' (' + p.seats + ')').join(', ') + '</div>' +
      '<textarea data-n="' + g + '" aria-label="מה ' + esc(nameOf(g)) + ' תעשה בפועל בנושא ' + esc(issue) + '">' + esc(n[g]) + '</textarea></div>').join('') + '</div>' +
    '<h3 style="margin-top:16px">מי עדיפה בסוגיה הזו בעיניכם?</h3>' +
    '<div class="pick">' + ['A','B'].map(g =>
      '<button type="button" data-g="' + g + '" aria-pressed="' + (S.choice[issue] === g) + '">' + esc(nameOf(g)) + '</button>').join('') + '</div>' +
    '<p class="muted" style="margin-top:8px">חייבים להכריע. אין תיקו.</p>' +
    '<div class="actions"><button class="btn ghost" id="back">חזרה</button><button class="btn" id="next"' + (S.choice[issue] ? '' : ' disabled') + '>' + (last ? 'לתוצאה' : 'לסוגיה הבאה') + '</button></div>';

  $app.querySelectorAll('textarea').forEach(t => t.oninput = () => { n[t.dataset.n] = t.value; });
  $app.querySelectorAll('.pick button').forEach(b => b.onclick = () => {
    S.choice[issue] = b.dataset.g;
    $app.querySelectorAll('.pick button').forEach(x => x.setAttribute('aria-pressed', x === b));
    document.getElementById('next').disabled = false;
  });
  document.getElementById('back').onclick = () => { if (S.idx > 0){ S.idx--; go(3); } else go(2); };
  document.getElementById('next').onclick = () => { if (last){ S.party = null; go(4); } else { S.idx++; go(3); } };
}

/* ---------- 4: הכרעה ---------- */
function tally(){
  const t = { A: 0, B: 0 };
  S.picked.forEach(i => { t[S.choice[i]]++; });
  return t;
}

function result(){
  const t = tally();
  const w = t.A > t.B ? 'A' : 'B';
  const l = w === 'A' ? 'B' : 'A';
  const list = partiesOf(w).slice().sort((a, b) => b.seats - a.seats);

  $app.innerHTML =
    '<div class="card verdict ' + w + '">' +
    '<div class="big">' + esc(nameOf(w)) + ' עדיפה בעיניכם, ' + t[w] + ' מול ' + t[l] + '</div>' +
    '<div>' + seatsOf(w) + ' מנדטים לפי ההערכה שלכם</div></div>' +
    (seatsOf(w) < NEEDED ? '<div class="warn">לפי המספרים ששמתם, ' + esc(nameOf(w)) + ' לא מגיעה ל־61. אם זה התרחיש שבו אתם מאמינים, שווה לשאול מה קורה אם היא לא מקימה ממשלה.</div>' : '') +
    '<div class="card"><h3>איך הגעתם לזה</h3>' + S.picked.map(i => {
      const g = S.choice[i];
      const nt = (S.notes[i] && S.notes[i][g] || '').trim();
      return '<div class="row"><div><strong>' + esc(i) + '</strong>' + (nt ? '<div class="note">' + esc(nt) + '</div>' : '') + '</div><div>' + esc(nameOf(g)) + '</div></div>';
    }).join('') + '</div>' +
    '<div class="card"><h3>עכשיו, מפלגה בתוך ' + esc(nameOf(w)) + '</h3>' +
    '<p class="muted">מפלגה שלא עוברת את אחוז החסימה מבזבזת את הקול. מפלגה קרובה לאחוז החסימה יכולה להרוויח ממנו הרבה.</p>' +
    list.map(p =>
      '<button type="button" class="pp" data-id="' + p.id + '" aria-pressed="' + (S.party === p.id) + '"><span>' + esc(p.name) + '</span><span>' +
      (p.seats <= THRESHOLD_SEATS ? '<span class="badge">קרובה לאחוז החסימה</span> ' : '') + p.seats + ' מנדטים</span></button>').join('') +
    '</div>' +
    '<div class="actions noprint"><button class="btn ghost" id="back">חזרה לעריכה</button>' +
    '<span style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" id="copy">העתקת הסיכום</button><button class="btn ghost" id="again">להתחיל מחדש</button></span></div>';

  $app.querySelectorAll('.pp').forEach(b => b.onclick = () => {
    S.party = +b.dataset.id;
    $app.querySelectorAll('.pp').forEach(x => x.setAttribute('aria-pressed', x === b));
  });
  document.getElementById('back').onclick = () => { S.idx = ISSUE_COUNT - 1; go(3); };
  document.getElementById('again').onclick = () => { if (confirm('כל מה שמילאתם יימחק. להתחיל מחדש?')){ S = fresh(); render(); window.scrollTo(0, 0); } };
  document.getElementById('copy').onclick = () => copySummary(w, t);
}

function summaryText(w, t){
  const l = w === 'A' ? 'B' : 'A';
  const out = [];
  out.push('בחרתי ' + nameOf(w) + ' (' + t[w] + ' מול ' + t[l] + ')');
  out.push('');
  out.push(nameOf('A') + ' (' + seatsOf('A') + '): ' + partiesOf('A').map(p => p.name).join(', '));
  out.push(nameOf('B') + ' (' + seatsOf('B') + '): ' + partiesOf('B').map(p => p.name).join(', '));
  out.push('');
  S.picked.forEach(i => {
    const g = S.choice[i];
    const nt = (S.notes[i] && S.notes[i][g] || '').trim();
    out.push('• ' + i + ': ' + nameOf(g) + (nt ? ' – ' + nt : ''));
  });
  if (S.party !== null) out.push('', 'מפלגה: ' + S.parties[S.party].name);
  return out.join('\n');
}

function copySummary(w, t){
  const btn = document.getElementById('copy');
  const text = summaryText(w, t);
  const done = () => { btn.textContent = 'הועתק'; setTimeout(() => { btn.textContent = 'העתקת הסיכום'; }, 1800); };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { btn.textContent = 'לא הצלחתי להעתיק'; }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

render();
</script>
</body>
