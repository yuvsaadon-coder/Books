<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#232B55">
  <title>מה שנקרא</title>
  <meta name="description" content="מה שנקרא: הספרייה שלך, רשימת 'רוצה לקרוא', חברים והמלצות קריאה חכמות ומאומתות">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="מה שנקרא">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preload" href="fonts/frank-ruhl-libre-hebrew-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/assistant-hebrew-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <!-- נבנה מראש: Tailwind + קוד האפליקציה (tools/build.mjs) -->
  <style>
    :root {
      --bg: #F6F1E7; --surface: #FFFDF8; --surface-2: #EFE8DA; --ink: #1B1A28; --muted: #6A6577;
      --line: #E6DCCB; --accent: #3446B0; --accent-2: #5E6FDB; --accent-ink: #FFFDF8; --accent-soft: #E7EAFB;
      --brass: #DF8A1F; --rose: #D4506C; --teal: #14897F; --danger: #C0473C; --ok: #2E8B57; --warn: #A86B10;
      --shadow: 0 1px 0 rgba(27,26,40,.03), 0 10px 24px -18px rgba(27,26,40,.35);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #100F17; --surface: #191823; --surface-2: #232231; --ink: #EDE8DF; --muted: #A39EB0;
        --line: #2D2B3B; --accent: #9DAEFF; --accent-2: #C3CCFF; --accent-ink: #100F17; --accent-soft: #262B52;
        --brass: #F4AE52; --rose: #F07A92; --teal: #4CC3B6; --danger: #F08C80; --ok: #7ED3A0; --warn: #F0C06A;
        --shadow: 0 1px 0 rgba(0,0,0,.2), 0 12px 28px -18px rgba(0,0,0,.8);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #100F17; --surface: #191823; --surface-2: #232231; --ink: #EDE8DF; --muted: #A39EB0;
      --line: #2D2B3B; --accent: #9DAEFF; --accent-2: #C3CCFF; --accent-ink: #100F17; --accent-soft: #262B52;
      --brass: #F4AE52; --rose: #F07A92; --teal: #4CC3B6; --danger: #F08C80; --ok: #7ED3A0; --warn: #F0C06A;
      --shadow: 0 1px 0 rgba(0,0,0,.2), 0 12px 28px -18px rgba(0,0,0,.8);
      color-scheme: dark;
    }
    html, body { background: var(--bg); color: var(--ink); }
    /* אווירה: זוהר עדין של דיו בפינה, כמו אור מנורת קריאה על נייר */
    body { background: radial-gradient(900px 520px at 110% -8%, var(--accent-soft), transparent 62%), radial-gradient(700px 420px at -20% 108%, color-mix(in srgb, var(--brass) 12%, transparent), transparent 60%), var(--bg); background-attachment: fixed; }
    .bg-surface.border, .bg-surface.border-line { box-shadow: var(--shadow); }
    .btn-primary { background: linear-gradient(135deg, var(--accent-2), var(--accent)); box-shadow: 0 8px 18px -10px color-mix(in srgb, var(--accent) 70%, transparent); }
    .glass { background: color-mix(in srgb, var(--surface) 84%, transparent); -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2); }
    .eyebrow { font-size: 12px; letter-spacing: .08em; font-weight: 700; color: var(--brass); }
    .wordmark { font-family: "Frank Ruhl Libre", Georgia, serif; font-weight: 700; letter-spacing: -.01em; }
    .rounded-xl { border-radius: 14px; }
    /* נגיעות צבע: קו מעבר צבע מתחת לכותרות הלשוניות, ופס עליון צבעוני לכרטיסי המלצה */
    main header h1.font-display { background: linear-gradient(90deg, var(--rose), var(--brass)) no-repeat right bottom / 44px 3px; padding-bottom: 8px; }
    .accent-top { border-top: 3px solid transparent; border-image: linear-gradient(90deg, var(--accent), var(--rose), var(--brass)) 1; }
    /* מצב קורא אלקטרוני: שחור-לבן בניגודיות מלאה, בלי אנימציות, צללים, שקיפויות ותמונות כבדות */
    :root[data-eink] { --bg: #fff; --surface: #fff; --surface-2: #efefef; --ink: #000; --muted: #2b2b2b; --line: #000; --accent: #000; --accent-2: #000; --accent-ink: #fff; --accent-soft: #e6e6e6; --brass: #000; --rose: #000; --teal: #000; --danger: #000; --ok: #000; --warn: #000; --shadow: none; color-scheme: light; }
    :root[data-eink] body { background: #fff; font-size: 18px; }
    :root[data-eink] *, :root[data-eink] *::before, :root[data-eink] *::after { animation: none !important; transition: none !important; box-shadow: none !important; }
    :root[data-eink] .glass { background: #fff; -webkit-backdrop-filter: none; backdrop-filter: none; }
    :root[data-eink] .btn-primary { background: #000; }
    :root[data-eink] main header h1.font-display { background: none; }
    :root[data-eink] .accent-top { border-image: none; border-top-color: #000; }
    :root[data-eink] .font-reading { font-size: 18.5px; line-height: 1.8; }
        nav .bg-accentSoft { background: linear-gradient(135deg, var(--accent-soft), color-mix(in srgb, var(--rose) 16%, var(--accent-soft))); }
    body { margin: 0; font-family: Assistant, "Segoe UI", Arial, sans-serif; font-size: 16px; line-height: 1.55; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
    /* טקסט לקריאה: תקצירים, הערות, שיחה */
    .font-reading { font-family: "Frank Ruhl Libre", "David Libre", Georgia, serif; font-size: 16.5px; line-height: 1.75; }
    h1, h2, h3 { text-wrap: balance; }
    .tabular { font-variant-numeric: tabular-nums; }
    .grid > *, main { min-width: 0; }
    html, body { overflow-x: hidden; }
    .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); }
    .safe-top { padding-top: env(safe-area-inset-top, 0px); }
    .clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .clamp-4 { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .fade-in { animation: fadeIn .18s ease-out both; }
    .sheet-in { animation: sheetIn .26s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes fadeIn { from { opacity: .0; } to { opacity: 1; } }
    @keyframes sheetIn { from { transform: translateY(16px); opacity: .6; } to { transform: none; opacity: 1; } }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .fade-in, .sheet-in, .spin { animation: none; } }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    input, textarea, select, button { font: inherit; color: inherit; }
    .boot { display: grid; place-items: center; min-height: 100vh; color: var(--muted); font-size: 16px; padding-inline: 16px; text-align: center; }
  </style>
  <style>/*__TAILWIND__*/</style>
</head>
<body>
  <div id="root"><div class="boot">טוען את מה שנקרא…</div></div>
  <script>
    // אירוע ההתקנה עלול להגיע לפני ש-React נטען, לכן תופסים אותו כאן
    // מצב קורא אלקטרוני (הגדרה של המכשיר): מופעל לפני הציור הראשון, בלי הבהוב
    try { if (localStorage.getItem('vrt-eink') === '1') document.documentElement.setAttribute('data-eink', ''); } catch (e) {}
    window.__installPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installPrompt = e; window.dispatchEvent(new Event('vrt-install-ready')); });
    window.addEventListener('appinstalled', function () { window.__installPrompt = null; window.dispatchEvent(new Event('vrt-install-ready')); });
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
  <script>/*__VENDOR__*/</script>
  <script>/*__APP__*/</script>
  <noscript>האפליקציה דורשת JavaScript.</noscript>
</body>
</html>
